<html lang="zh-CN">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: #04050a;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
  color: #e8eef5;
  overscroll-behavior: none;
  touch-action: none;
}
#scene { display: block; width: 100vw; height: 100vh; }

/* ---------- UI overlay ---------- */
#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 30px);
}

#title {
  font-family: 'STSong', 'Songti SC', 'SimSun', 'Noto Serif SC', serif;
  font-size: 19px;
  letter-spacing: 5px;
  font-weight: 600;
  text-indent: 5px;
  white-space: nowrap;
  color: rgba(240, 232, 245, 0.94);
  text-shadow: 0 2px 24px rgba(0,0,0,0.8), 0 0 40px rgba(220,150,210,0.3);
  transition: opacity 1.4s ease;
}

#status {
  margin-top: 14px;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  letter-spacing: 2px;
  color: rgba(200, 215, 235, 0.85);
  min-height: 1.4em;
  text-shadow: 0 1px 14px rgba(0,0,0,0.9);
  transition: color 0.6s ease, opacity 0.6s ease;
}
#status.guard { color: #ffd27a; text-shadow: 0 0 18px rgba(255,180,90,0.5); }
#status.ending { color: #ff9a8a; }

.top-wrap { display: flex; flex-direction: column; align-items: center; }

#controls {
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.mode-switch {
  display: flex;
  gap: 8px;
  padding: 6px;
  background: rgba(10, 16, 26, 0.5);
  border: 1px solid rgba(120, 150, 190, 0.18);
  border-radius: 16px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.mode-btn {
  border: none;
  background: transparent;
  color: rgba(200, 212, 230, 0.65);
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 3px;
  text-indent: 3px;
  padding: 12px 26px;
  border-radius: 11px;
  cursor: pointer;
  transition: background 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode-btn .ico { font-size: 16px; opacity: 0.9; }
.mode-btn.active.cruise {
  background: linear-gradient(180deg, rgba(90,130,180,0.4), rgba(50,80,120,0.32));
  color: #eaf2ff;
  box-shadow: 0 0 22px rgba(90,140,200,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
}
.mode-btn.active.combat {
  background: linear-gradient(180deg, rgba(190,90,80,0.42), rgba(130,55,50,0.32));
  color: #ffeee8;
  box-shadow: 0 0 22px rgba(210,90,70,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
}
/* 半亮态：第一段已执行、等待第二次点击（颜色渐变 + 脉冲提示） */
.mode-btn.half.cruise {
  background: linear-gradient(180deg, rgba(90,130,180,0.2), rgba(50,80,120,0.16));
  color: #cfdcf2;
  box-shadow: 0 0 14px rgba(90,140,200,0.22);
}
.mode-btn.half.combat {
  background: linear-gradient(180deg, rgba(190,90,80,0.22), rgba(130,55,50,0.16));
  color: #ffd9cd;
  box-shadow: 0 0 14px rgba(210,90,70,0.22);
}
.mode-btn.half { animation: halfPulse 1.3s ease-in-out infinite; }
@keyframes halfPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }

.guard-btn {
  pointer-events: auto;
  border: 1px solid rgba(255, 200, 120, 0.25);
  background: rgba(20, 16, 12, 0.4);
  color: rgba(230, 210, 180, 0.7);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 4px;
  text-indent: 4px;
  padding: 9px 20px;
  border-radius: 13px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all 0.5s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.guard-btn .heart { transition: all 0.5s ease; filter: grayscale(1) brightness(1.4); }
.guard-btn.active {
  color: #ffe0a8;
  border-color: rgba(255, 190, 110, 0.6);
  background: rgba(60, 40, 20, 0.45);
  box-shadow: 0 0 26px rgba(255, 170, 80, 0.4), inset 0 0 16px rgba(255,170,80,0.12);
}
.guard-btn.active .heart { filter: none; transform: scale(1.12); }

.hint {
  font-size: 12px;
  letter-spacing: 3px;
  text-indent: 3px;
  color: rgba(236, 196, 222, 0.5);
  margin-top: 2px;
  transition: opacity 0.7s ease;
  font-family: 'STSong', 'Songti SC', 'Noto Serif SC', serif;
}

/* fade the whole ui in on load */
#ui { animation: uiIn 2s ease both; }
@keyframes uiIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="ui">
  <div class="top-wrap">
    <div id="title">雨落笙歌起 · 舟轻浩海平</div>
    <div id="status"></div>
  </div>
  <div id="controls">
    <button class="guard-btn" id="btn-guard"><span class="heart">❤</span><span>守护美好</span></button>
    <div class="mode-switch">
      <button class="mode-btn cruise active" id="btn-cruise"><span class="ico">🌧</span>巡航</button>
      <button class="mode-btn combat" id="btn-combat"><span class="ico">⚔</span>战斗</button>
    </div>
    <div class="hint" id="hint">在下瞳雨 · 赤瞳之雨</div>
  </div>
</div>

<script>
'use strict';
// ============================================================
//  雨落笙歌起 — 星空浩海·小船第一人称
//  巡航(rain) ⟷ 战斗(sword)，纯 Canvas 2D，无依赖
// ============================================================

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, horizon = 0;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  horizon = H * 0.54;
  buildStars();
  buildClouds();
}
window.addEventListener('resize', resize);

// ---------- helpers ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const approach = (cur, target, rate) => cur + (target - cur) * clamp(rate, 0, 1);
let seed = 1234567;
const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// Catmull-Rom 样条：让位姿沿连续曲线运动（速度连续、带弧度，避免僵直切换）
const catmull1 = (p0, p1, p2, p3, t) => {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
};
function crPath(pts, u) {
  const n = pts.length - 1;
  let seg = Math.floor(u * n); if (seg > n - 1) seg = n - 1; if (seg < 0) seg = 0;
  const lt = u * n - seg;
  const p0 = pts[Math.max(0, seg - 1)], p1 = pts[seg], p2 = pts[seg + 1], p3 = pts[Math.min(n, seg + 2)];
  return { x: catmull1(p0.x, p1.x, p2.x, p3.x, lt), y: catmull1(p0.y, p1.y, p2.y, p3.y, lt) };
}

// ============================================================
//  STATE
// ============================================================
let mode = 'cruise';            // 'cruise' | 'combat'
let guard = false;              // 守护美好 → 战斗无时限
let combatEndAt = 0;                  // 战斗结束墙钟时间戳(ms)，!guard 时有效（墙钟计时，切后台不丢）
let combatRemainMs = 30 * 60 * 1000;  // 守护暂停时存的剩余
let tint = 0;                   // 0=cruise blue, 1=combat warm (crossfade)
let ending = 0;                 // 战斗到点提示淡入淡出

const rain = { t: 0, amount: 0.0, speedMul: 0.16, wind: -150, state: 'intro', flash: 0 };
const sword = { active: false, sheathing: false, t: 0, glint: 0, cap: Infinity };

// ============================================================
//  STARS / SKY
// ============================================================
let stars = [];
let milky = [];
let motes = [];
let clouds = [];
// 银河带：一条对角线，星星与星云向它聚集
function bandY(x) { return lerp(horizon * 0.86, horizon * 0.10, x / W); }
function buildStars() {
  stars = [];
  const colors = ['255,255,255', '255,255,255', '200,222,255', '255,238,210', '255,212,226', '188,236,255', '255,248,232'];
  const n = Math.min(880, Math.floor(W * H / 1600));   // 繁密：星星为主体
  let bright = 0;
  for (let i = 0; i < n; i++) {
    let x = rnd() * W, y = rnd() * (horizon - 4);
    if (rnd() < 0.5) {                                   // 约半数向银河带聚集
      x = rnd() * W;
      y = clamp(bandY(x) + (rnd() - 0.5) * horizon * 0.34, 2, horizon - 4);
    }
    let tier = 0; const rr = rnd();
    if (rr < 0.05 && bright < 36) { tier = 2; bright++; } // 亮星（带光晕+星芒）
    else if (rr < 0.32) tier = 1;                         // 中星
    stars.push({
      x, y, tier,
      r: tier === 2 ? 1.3 + rnd() * 1.6 : tier === 1 ? 0.7 + rnd() * 0.7 : 0.35 + rnd() * 0.7,
      a: tier === 2 ? 0.92 + rnd() * 0.08 : 0.42 + rnd() * 0.52,
      tw: rnd() * 6.28, tws: 0.4 + rnd() * 1.7,
      hue: colors[(rnd() * colors.length) | 0]
    });
  }
  // 绚彩星云：丰富配色（蓝/青/紫/品红/玫/金/翠），沿银河带 + 散布
  const neb = ['66,128,236', '60,200,210', '120,92,236', '232,86,188', '240,124,150', '240,196,110', '92,212,168'];
  milky = [];
  for (let i = 0; i < 22; i++) {
    const onBand = rnd() < 0.62;
    const x = rnd() * W;
    const y = clamp(onBand ? bandY(x) + (rnd() - 0.5) * horizon * 0.3 : rnd() * horizon * 0.95, 0, horizon);
    milky.push({
      x, y, r: 110 + rnd() * 210,
      a: 0.05 + rnd() * 0.075,
      hue: neb[(rnd() * neb.length) | 0],
      dph: rnd() * 6.28, damp: 8 + rnd() * 22
    });
  }
  motes = [];
  for (let i = 0; i < 14; i++) {
    motes.push({ x: rnd() * W, y: rnd() * horizon, r: 1 + rnd() * 2, a: 0.1 + rnd() * 0.2, ph: rnd() * 6.28, sp: 5 + rnd() * 10 });
  }
}

// 发光粉色云霞（近地平线下层天空）—— 多个柔团叠出蓬松感，底部受光更亮
function buildClouds() {
  clouds = [];
  const N = 6;
  for (let i = 0; i < N; i++) {
    const cx = (i + 0.5) / N * W + (rnd() - 0.5) * W * 0.14;
    const cy = horizon * (0.64 + rnd() * 0.32);
    const baseR = 64 + rnd() * 70;
    const puffs = [];
    const np = 4 + (rnd() * 4 | 0);
    for (let j = 0; j < np; j++) {
      puffs.push({ ox: (rnd() - 0.5) * baseR * 2.6, oy: (rnd() - 0.5) * baseR * 0.65, r: baseR * (0.55 + rnd() * 0.75), a: 0.12 + rnd() * 0.16 });
    }
    clouds.push({ cx, cy, puffs, drift: rnd() * 6.28, hue: rnd() < 0.5 ? '236,118,190' : '220,108,200', core: '255,184,226' });
  }
}
function drawClouds(now) {
  const t = now * 0.00008;
  for (const c of clouds) {
    const dx = Math.sin(t * 60 + c.drift) * 16;
    for (const p of c.puffs) {
      const x = c.cx + p.ox + dx, y = c.cy + p.oy;
      const rg = ctx.createRadialGradient(x, y + p.r * 0.3, p.r * 0.08, x, y, p.r);
      rg.addColorStop(0, `rgba(${c.core},${p.a})`);
      rg.addColorStop(0.5, `rgba(${c.hue},${p.a * 0.6})`);
      rg.addColorStop(1, `rgba(${c.hue},0)`);
      ctx.fillStyle = rg;
      ctx.fillRect(x - p.r, y - p.r, p.r * 2, p.r * 2);
    }
  }
}

let meteors = [];
function updateMeteors(dt) {
  if (meteors.length < 2 && rnd() < dt * 0.55) {        // 更频繁
    meteors.push({
      x: rnd() * W * 0.7 + W * 0.15, y: rnd() * horizon * 0.45,
      vx: 360 + rnd() * 320, vy: 150 + rnd() * 150,
      life: 0, max: 0.7 + rnd() * 0.6,
      hue: rnd() < 0.5 ? '255,255,255' : (rnd() < 0.5 ? '188,224,255' : '255,234,200')
    });
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i]; m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.life > m.max || m.y > horizon) meteors.splice(i, 1);
  }
}
function drawMeteors() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const m of meteors) {
    const a = Math.sin(clamp(m.life / m.max, 0, 1) * Math.PI);
    const tx = m.x - m.vx * 0.09, ty = m.y - m.vy * 0.09;
    const grd = ctx.createLinearGradient(tx, ty, m.x, m.y);
    grd.addColorStop(0, `rgba(${m.hue},0)`);
    grd.addColorStop(1, `rgba(${m.hue},${0.9 * a})`);
    ctx.strokeStyle = grd; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(m.x, m.y); ctx.stroke();
    const hg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 7);
    hg.addColorStop(0, `rgba(${m.hue},${a})`); hg.addColorStop(1, `rgba(${m.hue},0)`);
    ctx.fillStyle = hg; ctx.fillRect(m.x - 7, m.y - 7, 14, 14);
  }
  ctx.restore();
}

const moon = { x: 0, y: 0, r: 0 };
function drawSkyAndStars(now) {
  // 深邃夜空（暗底，使繁星突出，不发灰）
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#03040d');
  g.addColorStop(0.5, '#06091a');
  g.addColorStop(1, '#0b1028');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizon + 2);

  const dt2 = now * 0.001;
  // 绚彩星云（加色叠加：在暗空上发光而非发灰）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const m of milky) {
    const mx = m.x + Math.sin(dt2 * 0.05 + m.dph) * m.damp;
    const my = m.y + Math.cos(dt2 * 0.045 + m.dph) * m.damp * 0.5;
    const pulse = m.a * (0.7 + 0.3 * Math.sin(dt2 * 0.2 + m.dph));
    const rg = ctx.createRadialGradient(mx, my, 0, mx, my, m.r);
    rg.addColorStop(0, `rgba(${m.hue},${pulse})`);
    rg.addColorStop(0.55, `rgba(${m.hue},${pulse * 0.32})`);
    rg.addColorStop(1, `rgba(${m.hue},0)`);
    ctx.fillStyle = rg;
    ctx.fillRect(mx - m.r, my - m.r, m.r * 2, m.r * 2);
  }
  ctx.restore();

  // 满月（圆月）
  moon.x = W * 0.74; moon.y = horizon * 0.30; moon.r = Math.max(24, Math.min(W, H) * 0.048);
  const halo = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.r * 6);
  halo.addColorStop(0, 'rgba(220,230,255,0.30)');
  halo.addColorStop(0.4, 'rgba(170,180,235,0.10)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(moon.x - moon.r * 6, moon.y - moon.r * 6, moon.r * 12, moon.r * 12);
  const mg = ctx.createRadialGradient(moon.x - moon.r * 0.3, moon.y - moon.r * 0.3, 0, moon.x, moon.y, moon.r);
  mg.addColorStop(0, '#ffffff');
  mg.addColorStop(0.7, '#eef2ff');
  mg.addColorStop(1, '#cdd6ee');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2); ctx.fill();

  // 漂浮光尘
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of motes) {
    const my = ((p.y - dt2 * p.sp) % horizon + horizon) % horizon;
    const mx = p.x + Math.sin(dt2 * 0.4 + p.ph) * 16;
    const fl = p.a * (0.5 + 0.5 * Math.sin(dt2 * 0.8 + p.ph));
    const rg = ctx.createRadialGradient(mx, my, 0, mx, my, p.r * 4);
    rg.addColorStop(0, `rgba(225,235,255,${clamp(fl, 0, 0.4)})`);
    rg.addColorStop(1, 'rgba(225,235,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(mx - p.r * 4, my - p.r * 4, p.r * 8, p.r * 8);
  }
  ctx.restore();

  // 星星（主体）：暗底高对比，亮星带光晕 + 十字星芒
  for (const s of stars) {
    const tw = s.a * (0.55 + 0.45 * Math.sin(now * 0.001 * s.tws + s.tw));
    const al = clamp(tw, 0, 1);
    if (s.tier === 2) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const bg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 6);
      bg.addColorStop(0, `rgba(${s.hue},${al * 0.6})`);
      bg.addColorStop(1, `rgba(${s.hue},0)`);
      ctx.fillStyle = bg;
      ctx.fillRect(s.x - s.r * 6, s.y - s.r * 6, s.r * 12, s.r * 12);
      ctx.globalAlpha = al * 0.6;
      ctx.fillStyle = `rgba(${s.hue},1)`;
      ctx.fillRect(s.x - s.r * 5, s.y - 0.5, s.r * 10, 1);
      ctx.fillRect(s.x - 0.5, s.y - s.r * 5, 1, s.r * 10);
      ctx.restore();
      ctx.globalAlpha = al;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (s.tier === 1) {
      ctx.globalAlpha = al;
      ctx.fillStyle = `rgba(${s.hue},1)`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = al;
      ctx.fillStyle = `rgba(${s.hue},1)`;
      ctx.fillRect(s.x, s.y, s.r, s.r);
      ctx.globalAlpha = 1;
    }
  }

  // 流星
  drawMeteors();
}

// ============================================================
//  SEA
// ============================================================
function drawSea(now) {
  const g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0, '#0a1828');
  g.addColorStop(0.18, '#071019');
  g.addColorStop(1, '#02040a');
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon, W, H - horizon);

  // moon glitter path
  const t = now * 0.001;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 46; i++) {
    const fy = i / 46;
    const y = horizon + fy * (H - horizon) * 0.62;
    const spread = 6 + fy * fy * (moon.r * 3.4);
    const cx = moon.x + Math.sin(t * 1.6 + i * 1.7) * spread * 0.5;
    const w = (moon.r * 0.5) * (1 - fy * 0.4) + Math.sin(t * 3 + i) * 6;
    const a = (0.16 * (1 - fy)) * (0.6 + 0.4 * Math.sin(t * 4 + i * 2.3));
    ctx.fillStyle = `rgba(190,212,250,${clamp(a, 0, 0.2)})`;
    ctx.fillRect(cx - w / 2, y, w, 1.4);
  }
  // general wave shimmer
  for (let i = 0; i < 30; i++) {
    const fy = i / 30;
    const y = horizon + 4 + fy * (H - horizon) * 0.9;
    const x = ((i * 137.5 + t * 18 * (0.4 + fy)) % (W + 120)) - 60;
    const w = 30 + fy * 90;
    const a = 0.04 + fy * 0.05;
    ctx.fillStyle = `rgba(120,160,210,${a})`;
    ctx.fillRect(x, y, w, 1);
  }
  ctx.restore();

  // horizon glow line
  ctx.fillStyle = 'rgba(120,150,200,0.25)';
  ctx.fillRect(0, horizon - 1, W, 1.5);
}

// ============================================================
//  RAIN  (cruise)
// ============================================================
let drops = [];
function buildDrops() {
  drops = [];
  for (let i = 0; i < 620; i++) {
    const d = 0.4 + rnd();           // depth 0.4..1.4
    drops.push({
      x: rnd() * W * 1.2 - W * 0.1,
      y: rnd() * H,
      depth: d,
      spd: 460 + d * 760,
      len: 9 + d * 20,
      a: 0.14 + d * 0.30
    });
  }
}
function updateRain(dt) {
  if (rain.state === 'fadeout') {
    rain.amount = approach(rain.amount, 0, dt * 2.2);
  } else if (rain.state === 'awaitSheath') {
    const sp = sword.active ? clamp(sword.t / SHEATH_DUR, 0, 1) : 1;
    if (sp < 0.60) {                          // (b) 收鞘下行：把雨顺势带下来
      const k = sp / 0.60;
      rain.amount = 0.55 * k;
      rain.speedMul = 0.45 + 0.65 * k;
    } else {                                   // (c) 顿：雨缓慢停住（悬停感）
      rain.amount = Math.max(rain.amount, 0.5);
      rain.speedMul = approach(rain.speedMul, 0.05, dt * 3.5);
    }
    if (!sword.active || (sword.sheathing && sword.t >= SHEATH_DUR - 0.02)) {
      rain.state = 'burst'; rain.flash = 1;     // (d) 完全入鞘 → 倾落骤雨 + 闪光
    }
  } else if (rain.state === 'burst') {
    rain.amount = approach(rain.amount, 1.0, dt * 5);
    rain.speedMul = approach(rain.speedMul, 1.6, dt * 5);
    if (rain.amount > 0.97) rain.state = 'sustain';
  } else if (rain.state === 'intro') {
    rain.t += dt;
    const k = smooth(2.6, 5.0, rain.t);                      // 慢放细雨 → 骤雨
    rain.amount = lerp(0.15, 1.0, k);
    rain.speedMul = lerp(0.16, 1.55, k);
    if (k >= 1) rain.state = 'sustain';
  } else {                                                    // sustain：保持骤雨
    rain.amount = approach(rain.amount, 1.0, dt * 2);
    rain.speedMul = approach(rain.speedMul, 1.55, dt * 2);
  }
  if (rain.flash > 0) rain.flash = approach(rain.flash, 0, dt * 3);
  if (rain.amount < 0.001) return;
  const sm = rain.speedMul;
  const active = Math.floor(drops.length * rain.amount);
  for (let i = 0; i < active; i++) {
    const d = drops[i];
    d.y += d.spd * sm * dt;
    d.x += rain.wind * sm * dt * (d.depth * 0.5);
    if (d.y > H + d.len) { d.y = -d.len - rnd() * 40; d.x = rnd() * W * 1.25 - W * 0.12; }
  }
}
function drawRain() {
  if (rain.amount < 0.001) return;
  const sm = rain.speedMul;
  const active = Math.floor(drops.length * rain.amount);
  ctx.lineCap = 'round';
  for (let i = 0; i < active; i++) {
    const d = drops[i];
    const streak = d.len * (0.35 + sm * 0.9);
    const dx = rain.wind * 0.0016 * streak * d.depth;
    ctx.strokeStyle = `rgba(180,205,240,${d.a * clamp(rain.amount * 1.1, 0, 1)})`;
    ctx.lineWidth = 0.6 + d.depth * 0.7;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + dx, d.y + streak);
    ctx.stroke();
  }
}

// ============================================================
//  WAKE — 船前进：海面尾迹自地平线扑面流过 + 船首破浪泡沫
// ============================================================
let wake = [];
function buildWake() {
  wake = [];
  for (let i = 0; i < 80; i++) wake.push({ off: rnd() * 2 - 1, fy: rnd(), spd: 0.55 + rnd() * 0.7, w: 0.5 + rnd() * 0.9 });
}
function drawWake(dt) {
  const nb = horizon + (H - horizon) * 0.56;   // 近处水面下界（船沿之上）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of wake) {
    p.fy += (0.10 + p.fy * p.fy * 1.5) * p.spd * dt;   // 越近越快（透视加速）
    if (p.fy > 1.06) { p.fy = 0; p.off = rnd() * 2 - 1; p.spd = 0.55 + rnd() * 0.7; }
    const y = horizon + 4 + p.fy * (nb - horizon);
    const x = W * 0.5 + p.off * W * (0.03 + p.fy * p.fy * 0.6);    // 自地平线中心向外扩散
    const len = 4 + p.fy * p.fy * 30;
    const a = smooth(0, 0.18, p.fy) * (1 - smooth(0.82, 1.06, p.fy)) * 0.34 * p.w;
    const dirx = x - W * 0.5, diry = (y - horizon) + 0.0001;
    const dl = Math.hypot(dirx, diry) || 1;
    const ux = dirx / dl, uy = diry / dl;
    ctx.strokeStyle = `rgba(190,216,248,${clamp(a, 0, 0.5)})`;
    ctx.lineWidth = 0.8 + p.fy * 1.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - ux * len * 0.5, y - uy * len * 0.5);
    ctx.lineTo(x + ux * len * 0.5, y + uy * len * 0.5);
    ctx.stroke();
  }
  // 船首破浪：底部中央一抹流动泡沫光
  const foam = ctx.createRadialGradient(W * 0.5, nb, 0, W * 0.5, nb, W * 0.34);
  foam.addColorStop(0, 'rgba(200,222,250,0.12)');
  foam.addColorStop(1, 'rgba(200,222,250,0)');
  ctx.fillStyle = foam;
  ctx.fillRect(0, horizon, W, nb - horizon + 30);
  ctx.restore();
}

// ============================================================
//  BOAT (first person)
// ============================================================
let bobT = 0;
function boatBob() {
  return Math.sin(bobT * 0.7) * 6 + Math.sin(bobT * 1.7 + 1) * 2.5;
}
function drawBoat(now) {
  const bob = boatBob();
  const tilt = Math.sin(bobT * 0.55) * 0.01;

  // （灯笼已移除，改为纯月光）

  // boat foreground silhouette (we sit here, looking over the bow)
  ctx.save();
  ctx.translate(W / 2, H);
  ctx.rotate(tilt);
  ctx.translate(-W / 2, -H + bob);
  const topY = H - Math.min(150, H * 0.20);
  const dip = H - Math.min(96, H * 0.13);
  // rim light
  ctx.strokeStyle = 'rgba(150,180,225,0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-4, topY);
  ctx.quadraticCurveTo(W * 0.5, dip - 14, W + 4, topY);
  ctx.stroke();
  // body
  ctx.beginPath();
  ctx.moveTo(-4, topY);
  ctx.quadraticCurveTo(W * 0.5, dip, W + 4, topY);
  ctx.lineTo(W + 4, H + 4);
  ctx.lineTo(-4, H + 4);
  ctx.closePath();
  const bg = ctx.createLinearGradient(0, dip, 0, H);
  bg.addColorStop(0, '#0a0a0f');
  bg.addColorStop(1, '#020205');
  ctx.fillStyle = bg;
  ctx.fill();
  // a couple plank lines
  ctx.strokeStyle = 'rgba(120,150,200,0.05)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(0, dip + i * 18);
    ctx.quadraticCurveTo(W * 0.5, dip + i * 12, W, dip + i * 18);
    ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
//  SWORD (combat) — first person, blade forward
// ============================================================
function setSword(active, cap) {
  sword.cap = (cap === undefined) ? Infinity : cap;  // 暂停点：t 不超过 cap，第二次点击置 Infinity 续完
  sword.active = true;
  sword.sheathing = !active;
  sword.t = 0; sword.glint = 0;
}
// 刀鞘几何（与 drawScabbard 共用）；收刀时刀身沿此轴线滑入、被加宽的鞘遮挡 = 真正收进去
const SCAB_M = { x: 0.115, y: 0.80 };  // 鞘口（离开左缘，给加宽加长的刀柄留足空间）
const SCAB_D = { x: 0.30, y: 1.40 };   // 鞘尾（伸出画面外）
// 拔剑路径（沿用之前：弹鞘 → 顺时针上挥到头顶 → 挥下正前方）
const GRIP_PATH = [{ x: 0.00, y: 0.74 }, { x: 0.22, y: 0.70 }, { x: 0.49, y: 0.46 }, { x: 0.64, y: 1.00 }];
const TIP_PATH  = [{ x: 0.12, y: 0.98 }, { x: 0.03, y: 0.30 }, { x: 0.54, y: -0.12 }, { x: 0.50, y: 0.44 }];
const SHEATH_G  = { x: 0.06, y: 0.80 };   // 纯鞘中
const SHEATH_T  = { x: 0.18, y: 1.10 };
// 收刀空中弧线关键点
const ARC_FORWARD  = { gx: 0.64, gy: 1.00, tx: 0.50, ty: 0.44 };
const ARC_DOWNLEFT = { gx: 0.40, gy: 0.86, tx: 0.12, ty: 1.04 };

const POP_END = 0.30;        // 弹鞘结束（第一次点击停这里）
const DRAW_END = 2.25;       // 拔剑全程结束
const EXT_DP   = 0.34;       // ① 轴向滑出段：连续加速（先缓缓掠过"将收未收"高度，再加速抽出，不打顿）
const APEX_DP  = 0.63;       // ② 出鞘无缝衔接上挥（端速匹配），到头顶收住
const PAUSE_DP = 0.72;       // ③ 头顶顿到此，之后 ④ 发力斩下
const EXT_OUT  = 0.50;       // 滑出完成时的外移距离(×H)：上提幅度与鞘的下坠相称
const POP_OUT  = 0.085;      // 弹鞘弹出量(×H)：露出足够长的刃根给反光
const DROP_START = 0.18;     // 鞘坠离起点：恰在剑掠过"将收未收"高度之时（与剑上提同时）
const DROP_END = 0.49;       // 鞘坠离持续到此（加速下坠；可见部分恰在旋转前退出画面）
const SHEATH_DUR = 1.7;      // 收刀总时长
const SHEATH_ARC_END = 0.5;  // 收刀空中弧线占比（之后沿轴插入）

function sheathAxis() {
  const Mx = SCAB_M.x * W, My = SCAB_M.y * H, Dx = SCAB_D.x * W, Dy = SCAB_D.y * H;
  const dx = Dx - Mx, dy = Dy - My, l = Math.hypot(dx, dy) || 1;
  return { Mx, My, ux: dx / l, uy: dy / l };
}
function axisPose(outDist) {
  const a = sheathAxis(), L = 0.62 * H;
  const gx = a.Mx - a.ux * outDist, gy = a.My - a.uy * outDist;
  return { gx, gy, tx: gx + a.ux * L, ty: gy + a.uy * L };
}
// 刀鞘沿轴升降：拔刀时下移让位、收刀时升回原位来"接"刀（与剑同时运动）
function scabDropPx(st) {
  if (sword.sheathing) {                                      // 收刀：弧线段内升回原位，迎接落下的刀
    const sp = clamp(st / SHEATH_DUR, 0, 1);
    return (1 - smooth(0, SHEATH_ARC_END, sp)) * 0.80 * H;
  }
  if (st <= POP_END) return 0;
  const dp = (st - POP_END) / (DRAW_END - POP_END);
  const x = clamp((dp - DROP_START) / (DROP_END - DROP_START), 0, 1);
  return x * x * 0.80 * H; // 剑掠过悬停高度时起加速坠离（与剑上提同时、幅度相称），旋转前已让出刀身
}
// 收刀插入进度 k(0→1)：插大半(较快) → 将收未收顿 → 用力插到底
function sheathSlideEase(x) {
  if (x < 0.45) { const t = x / 0.45; return 0.7 * (t * t * (3 - 2 * t)); }
  if (x < 0.72) { const t = (x - 0.45) / 0.27; return 0.7 + 0.06 * t; }
  const t = (x - 0.72) / 0.28; return 0.76 + 0.24 * (0.8 * t * t * t + 0.2 * t);
}

// 拔剑姿势（剑柄样条 + 刀身角度样条）与弧长均匀化：
// ① 原始 tip 样条在起手处会掠过剑柄附近（近奇异），定长重整化后方向猛甩 —— 改为对"刀身角度"
//    做解缠后的样条插值，关键姿势不变、转速平滑、无奇异。
// ② 样条参数速度 ≠ 实际路程速度（各段长短不一，控制点处忽快忽慢）—— 预采样累计路程，
//    把"路程占比"反查成参数 u，快慢完全交给 drawEase 决定。
const ARC_N = 96;
let drawArc = null;   // { key, poseAtU, cum, total, apexS }
function unwrapTo(prev, a) { while (a - prev > Math.PI) a -= 2 * Math.PI; while (a - prev < -Math.PI) a += 2 * Math.PI; return a; }

  if (drawArc && drawArc.key === key) return;
  const ext = axisPose(EXT_OUT * H), L = 0.62 * H;   // 上挥起点 = 抽刀完成姿势（刀已离鞘）
  const gP = [{ x: ext.gx / W, y: ext.gy / H }, GRIP_PATH[1], GRIP_PATH[2], GRIP_PATH[3]];
  const tP = [{ x: ext.tx / W, y: ext.ty / H }, TIP_PATH[1], TIP_PATH[2], TIP_PATH[3]];
  const thP = [];                                // 各关键姿势的刀身角（像素空间，解缠成连续序列）
  for (let i = 0; i < 4; i++) {
    const a = Math.atan2(tP[i].y * H - gP[i].y * H, tP[i].x * W - gP[i].x * W);
    thP.push({ x: i ? unwrapTo(thP[i - 1].x, a) : a, y: 0 });
  }
  const poseAtU = (u) => {
    const g = crPath(gP, u), a = crPath(thP, u).x;
    const gx = g.x * W, gy = g.y * H;
    return { gx, gy, tx: gx + Math.cos(a) * L, ty: gy + Math.sin(a) * L };
  };
  const cum = [0];
  let prev = poseAtU(0);
  for (let i = 1; i <= ARC_N; i++) {
    const q = poseAtU(i / ARC_N);
    cum.push(cum[i - 1] + Math.hypot(q.tx - prev.tx, q.ty - prev.ty) + Math.hypot(q.gx - prev.gx, q.gy - prev.gy));
    prev = q;

  drawArc = { key, poseAtU, cum, total, apexS: cum[Math.round(ARC_N * 2 / 3)] / total };
}
function drawArcU(s) {                          // 路程占比 s → 样条参数 u
  const c = drawArc.cum, target = clamp(s, 0, 1) * drawArc.total;

  while (lo < hi) { const m = (lo + hi) >> 1; if (c[m] < target) lo = m + 1; else hi = m; }
  const f = c[lo] > c[lo - 1] ? (target - c[lo - 1]) / (c[lo] - c[lo - 1]) : 0;

function swordPoseAt(st) {
  const L = 0.62 * H;
  let g, t, P, a = 1;
  if (sword.sheathing) {                          // 收刀（保留：空中对准鞘口 → 沿轴插入，被鞘遮住）
    const sp = clamp(st / SHEATH_DUR, 0, 1);
    if (sp < SHEATH_ARC_END) {
      const al = axisPose(L);
      const gP = [{ x: ARC_FORWARD.gx, y: ARC_FORWARD.gy }, { x: ARC_DOWNLEFT.gx, y: ARC_DOWNLEFT.gy }, { x: al.gx / W, y: al.gy / H }];
      const tP = [{ x: ARC_FORWARD.tx, y: ARC_FORWARD.ty }, { x: ARC_DOWNLEFT.tx, y: ARC_DOWNLEFT.ty }, { x: al.tx / W, y: al.ty / H }];
      const u = smooth(0, SHEATH_ARC_END, sp);
      g = crPath(gP, u); t = crPath(tP, u);
      P = { gx: g.x * W, gy: g.y * H, tx: t.x * W, ty: t.y * H };
    } else {
      const k = sheathSlideEase((sp - SHEATH_ARC_END) / (1 - SHEATH_ARC_END));
      P = axisPose(lerp(L, 0, k));
    }
    a = 1 - smooth(0.97, 1.0, sp);

    P = axisPose(lerp(0, POP_OUT * H, smooth(0, POP_END, st)));

    drawArcEnsure();
    const dp = (st - POP_END) / (DRAW_END - POP_END);
    const LA = 2 * (EXT_OUT - POP_OUT) * H;       // 轴滑段路程（柄尖同移，与样条表的合计度量一致）
    const TOT = LA + drawArc.total;

    const sApex = (LA + drawArc.apexS * drawArc.total) / TOT;
    const CREEP = 0.05 * (1 - sApex);

    if (dp < EXT_DP) {                            // ① 缓缓上提→加速抽出：一条连续加速曲线，掠过悬停高度不打顿
      s = sExt * Math.pow(dp / EXT_DP, 2.4);
    } else if (dp < APEX_DP) {                    // ② 出鞘衔接上挥：起速=抽刀末速（Hermite，C¹连续），到头顶收住
      const x = (dp - EXT_DP) / (APEX_DP - EXT_DP), x2 = x * x, x3 = x2 * x;

    } else if (dp < PAUSE_DP) {                   // ③ 顿：头顶蓄力，微微续动
      s = sApex + CREEP * (dp - APEX_DP) / (PAUSE_DP - APEX_DP);
    } else {                                      // ④ 发力斩下
      const x = (dp - PAUSE_DP) / (1 - PAUSE_DP);
      s = sApex + CREEP + (1 - sApex - CREEP) * (0.8 * x * x * x + 0.2 * x);
    }
    P = (s <= sExt)
      ? axisPose(lerp(POP_OUT * H, EXT_OUT * H, s / sExt))         // 轴滑段（直线路程，匀映射）
      : drawArc.poseAtU(drawArcU((s - sExt) / (1 - sExt)));        // 样条段（弧长均匀）
  } else {                                         // 持剑向前 + 呼吸
    const sway = Math.sin((st - DRAW_END) * 1.5 + bobT * 0.7) * 0.006;
    g = { x: GRIP_PATH[3].x + Math.sin(bobT * 0.7) * 0.004, y: GRIP_PATH[3].y };
    t = { x: TIP_PATH[3].x + sway, y: TIP_PATH[3].y + sway * 0.5 };
    P = { gx: g.x * W, gy: g.y * H, tx: t.x * W, ty: t.y * H };
  }
  let gx = P.gx, gy = P.gy, tx = P.tx, ty = P.ty;
  const dx = tx - gx, dy = ty - gy, dl = Math.hypot(dx, dy) || 1;   // 定长刚体
  tx = gx + dx / dl * L; ty = gy + dy / dl * L;
  return { gx, gy, tx, ty, a };
}
function swordPose() { return swordPoseAt(sword.t); }

// 刀鞘（saya）：在左下，刀从鞘口滑出/归鞘
function drawScabbard(alpha) {

  const dx = SCAB_D.x * W + ax.ux * drop, dy = SCAB_D.y * H + ax.uy * drop;
  const ang = Math.atan2(dy - my, dx - mx);
  const nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
  const hw = 13;     // 鞘半宽：内壁贴合刀身（刀半宽 10.5 + 薄壁）
  const BOWS = 0;    // 直鞘：刀在鞘内拉直、沿正中进出（见 bladeFree），永不越壁

  const wS = (s) => hw * (1 - 0.3 * s);   // 向尾部略收
  const NS = 14;
  const edgeS = (k, s0, s1) => { const p = []; for (let i = 0; i <= NS; i++) { const s = s0 + (s1 - s0) * i / NS, c = sAt(s), w = wS(s) * k; p.push({ x: c.x + nx * w, y: c.y + ny * w }); } return p; };
  const ringS = (A, B) => { ctx.beginPath(); A.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); for (let i = B.length - 1; i >= 0; i--) ctx.lineTo(B[i].x, B[i].y); ctx.closePath(); };
  ctx.save();
  ctx.globalAlpha = alpha;
  ringS(edgeS(1, 0, 1), edgeS(-1, 0, 1));                            // 鞘身
  ctx.fillStyle = '#a31020';                                         // 主面：红色平涂（矩形截面）
  ctx.fill();
  ringS(edgeS(-0.55, 0, 1), edgeS(-1, 0, 1));                        // 侧面窄条：硬边折面 → 矩形截面感
  ctx.fillStyle = '#6e0812';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,190,196,0.42)'; ctx.lineWidth = 1.2;   // 受光上棱（硬棱线）
  ctx.beginPath();
  edgeS(1, 0, 1).forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.stroke();
  ringS(edgeS(1, 0.8, 1), edgeS(-1, 0.8, 1));                        // 鞘尾黑段（基本在画面外，按规格保留）
  ctx.fillStyle = '#120a0d';
  ctx.fill();
  ctx.strokeStyle = 'rgba(246,242,236,0.92)'; ctx.lineWidth = 3.5;   // 鞘口（koiguchi）白饰
  ctx.beginPath(); ctx.moveTo(mx + nx * hw, my + ny * hw); ctx.lineTo(mx - nx * hw, my - ny * hw); ctx.stroke();
  ctx.restore();
}
function mix(A, B, k) {
  return { gx: lerp(A.gx, B.gx, k), gy: lerp(A.gy, B.gy, k), tx: lerp(A.tx, B.tx, k), ty: lerp(A.ty, B.ty, k) };
}
// 刀身弧度系数：鞘内/出入鞘时拉直（沿鞘正中进出、绝不越壁），完全离鞘后弧度才显现
function bladeFree() {
  if (sword.sheathing) {
    const sp = clamp(sword.t / SHEATH_DUR, 0, 1);
    return 1 - smooth(SHEATH_ARC_END - 0.08, SHEATH_ARC_END, sp);   // 对准鞘口入鞘时拉直
  }
  if (sword.t <= POP_END) return 0;
  const dp = (sword.t - POP_END) / (DRAW_END - POP_END);
  return smooth(EXT_DP, EXT_DP + 0.10, dp);                          // 离鞘甩起时弧度显现
}
function drawSword() {
  if (!sword.active) return;
  const P = swordPose();
  const gx = P.gx, gy = P.gy, tx = P.tx, ty = P.ty;
  const ang = Math.atan2(ty - gy, tx - gx);
  const len = Math.hypot(tx - gx, ty - gy);
  const nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
  const ux = Math.cos(ang), uy = Math.sin(ang);

  // 挥剑/收刀弧光：采样最近若干帧的剑尖，连成渐隐弧形拖影（弧度感 / 动态模糊）
  if ((!sword.sheathing && sword.t > 0.34 && sword.t < DRAW_END + 0.15) || sword.sheathing) {
    const pts = [{ x: tx, y: ty }];
    for (let k = 1; k <= 7; k++) { const st = sword.t - k * 0.045; if (st < 0.02) break; const Q = swordPoseAt(st); pts.push({ x: Q.tx, y: Q.ty }); }
    if (pts.length > 2) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 0; i < pts.length - 1; i++) {
        ctx.strokeStyle = `rgba(206,228,255,${0.20 * (1 - i / pts.length)})`;
        ctx.lineWidth = 8 * (1 - i / (pts.length + 1));
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i + 1].x, pts[i + 1].y); ctx.stroke();
      }
      ctx.restore();
    }
  }

  ctx.save();
  ctx.globalAlpha = P.a;

  // --- blade：打刀——全长等宽；切先：刀背直抵尖端、刃口圆弧渐进收尖。
  //     刃口固定在 −n 侧：出鞘前就朝好方向，斩下时弧面自然朝下（全程不翻转）---
  const bw = 10.5, KISS = 0.86, curve = 8 * bladeFree();
  const enx = -nx, eny = -ny;
  const mx = (gx + tx) / 2 + enx * curve, my = (gy + ty) / 2 + eny * curve;
  const cAt = (s) => { const u1 = 1 - s; return { x: u1 * u1 * gx + 2 * u1 * s * mx + s * s * tx, y: u1 * u1 * gy + 2 * u1 * s * my + s * s * ty }; };
  const oE = (s) => { if (s < KISS) return bw; const q = (s - KISS) / (1 - KISS); return bw * (1 - 2 * Math.pow(q, 2.2)); };
  const off = (k, s) => -bw + k * (oE(s) + bw);                     // k：0=刀背 → 1=刃口（全部收敛于背侧尖端）
  const NB = 36;
  const lineAt = (k) => { const p = []; for (let i = 0; i <= NB; i++) { const s = i / NB, c = cAt(s), w = off(k, s); p.push({ x: c.x + enx * w, y: c.y + eny * w }); } return p; };
  const ptsS = lineAt(0), ptsB = lineAt(0.35), ptsM = lineAt(0.78), ptsE = lineAt(1);
  const ring = (A, B) => { ctx.beginPath(); A.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); for (let i = NB; i >= 0; i--) ctx.lineTo(B[i].x, B[i].y); ctx.closePath(); };
  const poly = (A) => { ctx.beginPath(); A.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); };
  ring(ptsE, ptsS);                                                 // 刀身整体
  const blade = ctx.createLinearGradient(gx, gy, tx, ty);
  blade.addColorStop(0, '#aeb8c4');
  blade.addColorStop(0.5, '#d6dee8');
  blade.addColorStop(1, '#f5f9fd');
  ctx.fillStyle = blade;
  ctx.fill();
  ring(ptsB, ptsS);                                                 // 背侧斜面压暗（镐线分出两个面）
  ctx.fillStyle = 'rgba(20,28,40,0.30)';
  ctx.fill();
  ring(ptsE, ptsM);                                                 // 刃侧斜面提亮（抛光刃区）
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(240,247,255,0.95)';                       // 刃口高光
  ctx.lineWidth = 1.4;
  poly(ptsE); ctx.stroke();
  ctx.strokeStyle = 'rgba(18,24,32,0.5)';                           // 刀背暗线
  ctx.lineWidth = 1.1;
  poly(ptsS); ctx.stroke();
  // 常驻刃面反光（镐线）：剑在手中就一直亮着（微呼吸），不随挥剑结束而消失
  const shimmer = 0.78 + 0.22 * Math.sin(bobT * 1.4);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(215,232,252,${0.18 * shimmer})`;          // 柔光晕
  ctx.lineWidth = 5.5;
  poly(ptsM); ctx.stroke();
  ctx.strokeStyle = `rgba(248,252,255,${0.85 * shimmer})`;          // 反光亮芯
  ctx.lineWidth = 2.2;
  poly(ptsM); ctx.stroke();
  // 刃根高光：出鞘可见段的常亮反光（弹鞘/悬停状态从镡口冒出就能看到）
  const so = off(0.78, 0) * 0.9;
  ctx.strokeStyle = `rgba(255,255,255,${0.85 * shimmer})`;
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(gx + ux * 20 + enx * so, gy + uy * 20 + eny * so);
  ctx.lineTo(gx + ux * 66 + enx * so * 0.7, gy + uy * 66 + eny * so * 0.7);
  ctx.stroke();
  // 刃根流光：一道亮光沿刃根反复滑过、没入鞘口（让"在反光"一眼可见）
  const swp = (bobT * 0.5) % 1;
  const swc = 20 + swp * 56, swa = Math.sin(swp * Math.PI);
  ctx.strokeStyle = `rgba(255,255,255,${0.95 * swa})`;
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  ctx.moveTo(gx + ux * (swc - 9) + enx * so, gy + uy * (swc - 9) + eny * so);
  ctx.lineTo(gx + ux * (swc + 9) + enx * so * 0.8, gy + uy * (swc + 9) + eny * so * 0.8);
  ctx.stroke();
  ctx.restore();

  // --- 巡走流光：战斗常驻时，一道亮光沿弯曲镐线从刀根滑向刀尖、滑出尖端，循环往复（慢频率）---
  if (!sword.sheathing && sword.t > DRAW_END) {
    sword.glint += 0.016;
    const CYC = 3.8, TRAVEL = 1.4, TAIL = 0.12;    // ~3.8s 一轮，滑行 1.4s，彗尾占刃长 12%
    const ph = sword.glint % CYC;
    if (ph <= TRAVEL) {
      const gp = ph / TRAVEL;
      const head = gp * (1 + TAIL);                 // 头部 0 → 1+TAIL（完整滑出刀尖）
      const env = smooth(0, 0.12, gp);              // 起步淡入
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      const M = 8, LANE = 0.45;                     // 流光车道：刀身中部钢面（避开常亮的镐线）
      for (let i = 0; i < M; i++) {                 // 彗星：头亮尾淡（光晕+亮芯两层）
        let s1 = head - TAIL * (i + 1) / M, s2 = head - TAIL * i / M;
        s1 = clamp(s1, 0, 1); s2 = clamp(s2, 0, 1);
        if (s2 - s1 < 1e-4) continue;
        const c1 = cAt(s1), c2 = cAt(s2);
        const w1 = off(LANE, s1), w2 = off(LANE, s2);
        const x1 = c1.x + enx * w1, y1 = c1.y + eny * w1, x2 = c2.x + enx * w2, y2 = c2.y + eny * w2;
        const fade = (1 - i / M) * env;
        ctx.strokeStyle = `rgba(225,240,255,${0.30 * fade})`;
        ctx.lineWidth = 8 - 3 * (i / M);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${0.9 * fade})`;
        ctx.lineWidth = 3.4 - 1.8 * (i / M);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      if (head <= 1) {                              // 头部亮点
        const ch = cAt(head), wh = off(LANE, head);
        ctx.fillStyle = `rgba(255,255,255,${0.95 * env})`;
        ctx.beginPath(); ctx.arc(ch.x + enx * wh, ch.y + eny * wh, 3.2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  // --- handle（村雨风：修长红柄平头尾，中段白色矩形留白区，两端红段缀 X 纹）——画在刀身之上 ---
  const hbx = gx + ux * 6, hby = gy + uy * 6;
  const bx = gx - ux * 115, by = gy - uy * 115;                 // 柄尾（修长）
  ctx.strokeStyle = '#ad1422';
  ctx.lineWidth = 24; ctx.lineCap = 'butt';                     // 柄宽 = 1.2×；平头：尾端平切
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(hbx, hby); ctx.stroke();
  ctx.strokeStyle = '#f5f1ea';                                  // 中段白色矩形区（留白，无字符，加长）
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.moveTo(lerp(bx, hbx, 0.18), lerp(by, hby, 0.18));
  ctx.lineTo(lerp(bx, hbx, 0.82), lerp(by, hby, 0.82));
  ctx.stroke();
  ctx.strokeStyle = 'rgba(88,6,14,0.8)';                        // 红段 X 缠纹
  ctx.lineWidth = 1.9; ctx.lineCap = 'round';
  for (const f of [0.04, 0.10, 0.16, 0.84, 0.90, 0.96]) {
    const px = lerp(bx, hbx, f), py = lerp(by, hby, f), o = 3.8;
    ctx.beginPath();
    ctx.moveTo(px - nx * 9.5 - ux * o, py - ny * 9.5 - uy * o); ctx.lineTo(px + nx * 9.5 + ux * o, py + ny * 9.5 + uy * o);
    ctx.moveTo(px - nx * 9.5 + ux * o, py - ny * 9.5 + uy * o); ctx.lineTo(px + nx * 9.5 - ux * o, py + ny * 9.5 - uy * o);
    ctx.stroke();
  }
  ctx.strokeStyle = '#7a0d19';                                  // 柄头：扁平帽（平切面）
  ctx.lineWidth = 24; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + ux * 8.5, by + uy * 8.5); ctx.stroke();
  ctx.strokeStyle = 'rgba(228,234,242,0.5)'; ctx.lineWidth = 1.3;   // 尾端银线
  ctx.beginPath(); ctx.moveTo(bx + nx * 12, by + ny * 12); ctx.lineTo(bx - nx * 12, by - ny * 12); ctx.stroke();
  // --- guard（tsuba：村雨式矩形）——盖在刀身上，把刀身包进去 ---
  const tcx = gx + ux * 8, tcy = gy + uy * 8, ta = 8, tb = 22;
  ctx.fillStyle = '#8a0f1c';
  ctx.beginPath();
  ctx.moveTo(tcx + ux * ta + nx * tb, tcy + uy * ta + ny * tb);
  ctx.lineTo(tcx + ux * ta - nx * tb, tcy + uy * ta - ny * tb);
  ctx.lineTo(tcx - ux * ta - nx * tb, tcy - uy * ta - ny * tb);
  ctx.lineTo(tcx - ux * ta + nx * tb, tcy - uy * ta + ny * tb);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(228,234,242,0.6)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();
  // 鞘：画在刀之后 → 遮住仍在鞘内的部分，形成出鞘/归鞘
  drawScabbard(sword.sheathing ? P.a : 1);

  // ① 弹鞘：鞘口星芒闪光——弹出亮起后持续闪烁（与收刀"将收未收"的冒光同款），第二击拔剑才熄
  if (!sword.sheathing && sword.t < POP_END + 0.06) {
    const tw = 0.70 + 0.30 * Math.sin(bobT * 2.6);             // 闪烁
    const fl = smooth(0, 0.26, sword.t) * (1 - smooth(POP_END + 0.005, POP_END + 0.06, sword.t)) * tw;
    const mx = SCAB_M.x * W, my = SCAB_M.y * H;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createRadialGradient(mx, my, 0, mx, my, 44);
    fg.addColorStop(0, `rgba(228,242,255,${0.55 * fl})`);
    fg.addColorStop(0.5, `rgba(150,190,240,${0.18 * fl})`);
    fg.addColorStop(1, 'rgba(150,190,240,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(mx - 44, my - 44, 88, 88);
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * fl})`; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx - 16, my); ctx.lineTo(mx + 16, my);
    ctx.moveTo(mx, my - 16); ctx.lineTo(mx, my + 16);
    ctx.stroke();
    ctx.restore();
  }

  // 收刀：将收未收时冒一下光（鞘口）
  if (sword.sheathing) {
    const sp = sword.t / SHEATH_DUR;
    if (sp > 0.70 && sp < 0.93) {
      const fl = Math.sin(smooth(0.70, 0.80, sp) * Math.PI * 0.5) * (1 - smooth(0.88, 0.93, sp));
      const mx = SCAB_M.x * W, my = SCAB_M.y * H;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const fg = ctx.createRadialGradient(mx, my, 0, mx, my, 42);
      fg.addColorStop(0, `rgba(228,242,255,${0.55 * fl})`);
      fg.addColorStop(0.5, `rgba(150,190,240,${0.18 * fl})`);
      fg.addColorStop(1, 'rgba(150,190,240,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(mx - 42, my - 42, 84, 84);
      ctx.strokeStyle = `rgba(255,255,255,${0.75 * fl})`; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(mx - 16, my); ctx.lineTo(mx + 16, my);
      ctx.moveTo(mx, my - 16); ctx.lineTo(mx, my + 16);
      ctx.stroke();
      ctx.restore();
    }
  }
}

//  TINT / VIGNETTE
// ============================================================
function drawAtmosphere() {
  // mode color wash
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const warm = tint, cool = 1 - tint;
  if (cool > 0.01) {
    ctx.fillStyle = `rgba(90,70,150,${0.025 * cool})`;     // 巡航：淡紫微染，不发灰
    ctx.fillRect(0, 0, W, H);
  }
  if (warm > 0.01) {
    const wg = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.7);
    wg.addColorStop(0, `rgba(150,60,40,${0.05 * warm})`);
    wg.addColorStop(1, `rgba(120,40,30,${0.10 * warm})`);
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, H);
  }
  if (rain.flash > 0.01) {                                  // 骤雨倾落瞬间的闪光
    ctx.fillStyle = `rgba(220,228,255,${rain.flash * 0.12})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  // vignette（减弱 + 暗紫，避免灰蒙蒙）
  const v = ctx.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.42, W * 0.5, H * 0.5, Math.max(W, H) * 0.82);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(8,4,16,0.38)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

const elStatus = document.getElementById('status');
const elTitle = document.getElementById('title');
const elHint = document.getElementById('hint');
const btnCruise = document.getElementById('btn-cruise');
const btnCombat = document.getElementById('btn-combat');

// ---- 音频 / 提醒 / 后台保活 / 屏幕常亮（用于战斗倒计时维持与到点提醒）----
let audioCtx = null, keepNode = null, wakeLock = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function chimeDone() {
  ensureAudio(); if (!audioCtx) return;
  const t0 = audioCtx.currentTime, tones = [659, 880, 1175];
  tones.forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0 + i * 0.16);
    g.gain.linearRampToValueAtTime(0.3, t0 + i * 0.16 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.16 + 0.5);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0 + i * 0.16); o.stop(t0 + i * 0.16 + 0.55);
  });
}
function vibrate(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }
function startKeepAlive() {            // 近无声振荡器，尽量让后台不被挂起（安卓有效，iOS 有限）
  ensureAudio(); if (!audioCtx || keepNode) return;
  try {
    keepNode = audioCtx.createOscillator();
    const g = audioCtx.createGain(); g.gain.value = 0.0001;
    keepNode.frequency.value = 40;
    keepNode.connect(g).connect(audioCtx.destination);
    keepNode.start();
  } catch (e) {}
}
function stopKeepAlive() { try { if (keepNode) { keepNode.stop(); keepNode.disconnect(); keepNode = null; } } catch (e) {} }
async function requestWakeLock() { if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} } }
function releaseWakeLock() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {} }
function combatRemainingSec() {
  if (mode !== 'combat' || guard || !combatEndAt) return Infinity;
  return Math.max(0, (combatEndAt - Date.now()) / 1000);
}
function checkCombatEnd() {            // 墙钟判定到点（前台/后台/切回 都能触发）
  if (mode === 'combat' && !guard && combatEndAt && Date.now() >= combatEndAt) {
    ending = 2.5;
    chimeDone();
    vibrate([200, 100, 200, 100, 400]);
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification('雨落笙歌起', { body: '时已尽 · 雨复落' }); } catch (e) {}
    }
    autoReturnCruise();
  }
}

// ---- 两段式切换：每个模式按钮点两下，按钮颜色分级渐变 ----
let phase = 'cruise';                 // 'cruise' | 'arming' | 'combat' | 'sheathing'
const POP_CAP = POP_END;              // 弹鞘结束（拔剑第一段暂停点）
const HANG_CAP = 0.78 * SHEATH_DUR;   // 收刀"将收未收"停顿点

function setModeButtons() {
  btnCombat.classList.toggle('active', phase === 'combat');
  btnCombat.classList.toggle('half', phase === 'arming');
  btnCruise.classList.toggle('active', phase === 'cruise');
  btnCruise.classList.toggle('half', phase === 'sheathing');
  elTitle.style.opacity = '0.32';
}

function onCombatClick() {
  if (phase === 'combat') return;
  if (phase === 'arming') {                 // 第二下：拔剑→举顶→挥下（连贯）
    phase = 'combat'; mode = 'combat';
    sword.cap = Infinity;
    combatRemainMs = 30 * 60 * 1000;
    combatEndAt = guard ? 0 : Date.now() + combatRemainMs;
    startKeepAlive(); requestWakeLock();
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  } else {                                   // 第一下：弹鞘 + 骤雨停下
    phase = 'arming'; mode = 'combat';
    combatEndAt = 0;
    rain.state = 'fadeout';
    ensureAudio();
    setSword(true, POP_CAP);
  }
  setModeButtons();
}

function onCruiseClick() {
  if (phase === 'cruise') return;
  if (phase === 'sheathing') {              // 第二下：插到底 + 慢动作雨瞬间倾落
    phase = 'cruise'; mode = 'cruise';
    sword.cap = Infinity;                    // 释放 → 到 home → awaitSheath 触发骤雨
  } else {                                   // 第一下：收刀到"将收未收" + 雨引下→慢动作
    phase = 'sheathing'; mode = 'cruise';
    combatEndAt = 0;
    stopKeepAlive(); releaseWakeLock();
    rain.state = 'awaitSheath';
    setSword(false, HANG_CAP);
  }
  setModeButtons();
}

function autoReturnCruise() {               // 战斗到点：自动一气呵成收刀回巡航
  phase = 'cruise'; mode = 'cruise';
  combatEndAt = 0;
  stopKeepAlive(); releaseWakeLock();
  rain.state = 'awaitSheath';
  setSword(false, Infinity);
  setModeButtons();
}
function toggleGuard() {
  guard = !guard;
  btnGuard.classList.toggle('active', guard);
  if (phase === 'combat') {
    if (guard) { if (combatEndAt) combatRemainMs = combatEndAt - Date.now(); combatEndAt = 0; }   // 暂停倒计时
    else { combatEndAt = Date.now() + Math.max(0, combatRemainMs); }                                // 恢复倒计时
  }
}
// 底部小字：固定轮回两句（与模式无关）
const HINTS = ['在下瞳雨 · 赤瞳之雨', '心向美好 · 瞳雨不止'];
let hintIdx = 0, hintTimer = 0, hintFading = false;
function updateHint() { elHint.textContent = HINTS[hintIdx]; }
function cycleHint(dt) {
  hintTimer += dt;
  if (hintTimer > 5.5 && !hintFading) {
    hintFading = true;
    elHint.style.opacity = '0';
    setTimeout(() => {
      hintIdx = (hintIdx + 1) % HINTS.length;
      elHint.textContent = HINTS[hintIdx];
      elHint.style.opacity = '1';
      hintTimer = 0; hintFading = false;
    }, 700);
  }
}

btnCruise.addEventListener('click', onCruiseClick);
btnCombat.addEventListener('click', onCombatClick);
btnGuard.addEventListener('click', toggleGuard);

let titleHidden = false;
function updateStatus(dt) {
  checkCombatEnd();   // 墙钟判定到点（切后台不丢时间）
  let txt = '', cls = '';
  if (phase === 'combat') {
    if (guard) { txt = '守护中 · ∞'; cls = 'guard'; }
    else {
      const s = Math.max(0, Math.ceil(combatRemainingSec()));
      txt = `战 · ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }
  } else if (ending > 0) {
    txt = '时已尽 · 雨复落'; cls = 'ending';
  }
  elStatus.textContent = txt;
  elStatus.className = cls;
  if (ending > 0) ending -= dt;

  // fade title out after intro
  if (!titleHidden && tNow > 5) { titleHidden = true; elTitle.style.opacity = '0.28'; }
}

// ============================================================
//  LOOP
// ============================================================
let last = 0, tNow = 0;
function frame(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;     // clamp big gaps
  tNow += dt;
  bobT += dt;

  // crossfade tint toward target
  tint = approach(tint, mode === 'combat' ? 1 : 0, dt * 1.4);

  // sword timeline
  if (sword.active) {
    sword.t += dt;
    if (sword.t > sword.cap) sword.t = sword.cap;     // 停在暂停点
    if (sword.sheathing && sword.t > SHEATH_DUR + 0.04) sword.active = false;
  }

  updateMeteors(dt);
  updateRain(dt);
  updateStatus(dt);
  cycleHint(dt);

  // ---- draw ----
  ctx.clearRect(0, 0, W, H);
  drawSkyAndStars(now);
  drawSea(now);
  drawWake(dt);
  drawRain();
  drawBoat(now);
  drawSword();
  drawAtmosphere();

  requestAnimationFrame(frame);
}

// pause when hidden (battery)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    last = 0;                 // 重置帧时基，避免回前台跳变
    checkCombatEnd();         // 切回时立即结算战斗倒计时
    if (mode === 'combat') requestWakeLock();   // 屏幕常亮会在隐藏时释放，回前台重新申请
  }
});
// 后台看门狗：即使动画帧暂停，也按墙钟判定战斗到点（配合保活在安卓后台可触发提醒）
setInterval(checkCombatEnd, 1000);

// ---------- init ----------
resize();
buildDrops();
buildWake();
updateHint();
setModeButtons();
requestAnimationFrame(frame);
</script>
</body>
</html>
