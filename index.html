<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>雨落笙歌起</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: #04050a;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
  color: #e8eef5;
  overscroll-behavior: none;
  touch-action: none;
}
#scene { display: block; width: 100vw; height: 100vh; }

/* ---------- UI overlay ---------- */
#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 30px);
}

#title {
  font-family: 'STSong', 'Songti SC', 'SimSun', 'Noto Serif SC', serif;
  font-size: 19px;
  letter-spacing: 5px;
  font-weight: 600;
  text-indent: 5px;
  white-space: nowrap;
  color: rgba(240, 232, 245, 0.94);
  text-shadow: 0 2px 24px rgba(0,0,0,0.8), 0 0 40px rgba(220,150,210,0.3);
  transition: opacity 1.4s ease;
}

#status {
  margin-top: 14px;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  letter-spacing: 2px;
  color: rgba(200, 215, 235, 0.85);
  min-height: 1.4em;
  text-shadow: 0 1px 14px rgba(0,0,0,0.9);
  transition: color 0.6s ease, opacity 0.6s ease;
}
#status.guard { color: #ffd27a; text-shadow: 0 0 18px rgba(255,180,90,0.5); }
#status.ending { color: #ff9a8a; }

.top-wrap { display: flex; flex-direction: column; align-items: center; }

#controls {
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.mode-switch {
  display: flex;
  gap: 8px;
  padding: 6px;
  background: rgba(10, 16, 26, 0.5);
  border: 1px solid rgba(120, 150, 190, 0.18);
  border-radius: 16px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.mode-btn {
  border: none;
  background: transparent;
  color: rgba(200, 212, 230, 0.65);
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 3px;
  text-indent: 3px;
  padding: 12px 26px;
  border-radius: 11px;
  cursor: pointer;
  transition: background 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode-btn .ico { font-size: 16px; opacity: 0.9; }
.mode-btn.active.cruise {
  background: linear-gradient(180deg, rgba(90,130,180,0.4), rgba(50,80,120,0.32));
  color: #eaf2ff;
  box-shadow: 0 0 22px rgba(90,140,200,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
}
.mode-btn.active.combat {
  background: linear-gradient(180deg, rgba(190,90,80,0.42), rgba(130,55,50,0.32));
  color: #ffeee8;
  box-shadow: 0 0 22px rgba(210,90,70,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
}

.guard-btn {
  pointer-events: auto;
  border: 1px solid rgba(255, 200, 120, 0.25);
  background: rgba(20, 16, 12, 0.4);
  color: rgba(230, 210, 180, 0.7);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 4px;
  text-indent: 4px;
  padding: 9px 20px;
  border-radius: 13px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all 0.5s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.guard-btn .heart { transition: all 0.5s ease; filter: grayscale(1) brightness(1.4); }
.guard-btn.active {
  color: #ffe0a8;
  border-color: rgba(255, 190, 110, 0.6);
  background: rgba(60, 40, 20, 0.45);
  box-shadow: 0 0 26px rgba(255, 170, 80, 0.4), inset 0 0 16px rgba(255,170,80,0.12);
}
.guard-btn.active .heart { filter: none; transform: scale(1.12); }

.hint {
  font-size: 12px;
  letter-spacing: 3px;
  text-indent: 3px;
  color: rgba(236, 196, 222, 0.5);
  margin-top: 2px;
  transition: opacity 0.7s ease;
  font-family: 'STSong', 'Songti SC', 'Noto Serif SC', serif;
}

/* fade the whole ui in on load */
#ui { animation: uiIn 2s ease both; }
@keyframes uiIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="ui">
  <div class="top-wrap">
    <div id="title">雨落笙歌起 · 舟轻浩海平</div>
    <div id="status"></div>
  </div>
  <div id="controls">
    <button class="guard-btn" id="btn-guard"><span class="heart">❤</span><span>守护美好</span></button>
    <div class="mode-switch">
      <button class="mode-btn cruise active" id="btn-cruise"><span class="ico">🌧</span>巡航</button>
      <button class="mode-btn combat" id="btn-combat"><span class="ico">⚔</span>战斗</button>
    </div>
    <div class="hint" id="hint">在下瞳雨 · 赤瞳之雨</div>
  </div>
</div>

<script>
'use strict';
// ============================================================
//  雨落笙歌起 — 星空浩海·小船第一人称
//  巡航(rain) ⟷ 战斗(sword)，纯 Canvas 2D，无依赖
// ============================================================

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, horizon = 0;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  horizon = H * 0.54;
  buildStars();
  buildClouds();
}
window.addEventListener('resize', resize);

// ---------- helpers ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const approach = (cur, target, rate) => cur + (target - cur) * clamp(rate, 0, 1);
let seed = 1234567;
const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// Catmull-Rom 样条：让位姿沿连续曲线运动（速度连续、带弧度，避免僵直切换）
const catmull1 = (p0, p1, p2, p3, t) => {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
};
function crPath(pts, u) {
  const n = pts.length - 1;
  let seg = Math.floor(u * n); if (seg > n - 1) seg = n - 1; if (seg < 0) seg = 0;
  const lt = u * n - seg;
  const p0 = pts[Math.max(0, seg - 1)], p1 = pts[seg], p2 = pts[seg + 1], p3 = pts[Math.min(n, seg + 2)];
  return { x: catmull1(p0.x, p1.x, p2.x, p3.x, lt), y: catmull1(p0.y, p1.y, p2.y, p3.y, lt) };
}

// ============================================================
//  STATE
// ============================================================
let mode = 'cruise';            // 'cruise' | 'combat'
let guard = false;              // 守护美好 → 战斗无时限
let combatRemaining = 30 * 60;  // 秒
let tint = 0;                   // 0=cruise blue, 1=combat warm (crossfade)
let ending = 0;                 // 战斗到点提示淡入淡出

const rain = { t: 0, amount: 0.0, speedMul: 0.16, wind: -150, state: 'intro', flash: 0 };
const sword = { active: false, sheathing: false, t: 0, glint: 0 };

// ============================================================
//  STARS / SKY
// ============================================================
let stars = [];
let milky = [];
let motes = [];
let clouds = [];
// 银河带：一条对角线，星星与星云向它聚集
function bandY(x) { return lerp(horizon * 0.86, horizon * 0.10, x / W); }
function buildStars() {
  stars = [];
  const colors = ['255,255,255', '255,255,255', '200,222,255', '255,238,210', '255,212,226', '188,236,255', '255,248,232'];
  const n = Math.min(880, Math.floor(W * H / 1600));   // 繁密：星星为主体
  let bright = 0;
  for (let i = 0; i < n; i++) {
    let x = rnd() * W, y = rnd() * (horizon - 4);
    if (rnd() < 0.5) {                                   // 约半数向银河带聚集
      x = rnd() * W;
      y = clamp(bandY(x) + (rnd() - 0.5) * horizon * 0.34, 2, horizon - 4);
    }
    let tier = 0; const rr = rnd();
    if (rr < 0.05 && bright < 36) { tier = 2; bright++; } // 亮星（带光晕+星芒）
    else if (rr < 0.32) tier = 1;                         // 中星
    stars.push({
      x, y, tier,
      r: tier === 2 ? 1.3 + rnd() * 1.6 : tier === 1 ? 0.7 + rnd() * 0.7 : 0.35 + rnd() * 0.7,
      a: tier === 2 ? 0.92 + rnd() * 0.08 : 0.42 + rnd() * 0.52,
      tw: rnd() * 6.28, tws: 0.4 + rnd() * 1.7,
      hue: colors[(rnd() * colors.length) | 0]
    });
  }
  // 绚彩星云：丰富配色（蓝/青/紫/品红/玫/金/翠），沿银河带 + 散布
  const neb = ['66,128,236', '60,200,210', '120,92,236', '232,86,188', '240,124,150', '240,196,110', '92,212,168'];
  milky = [];
  for (let i = 0; i < 22; i++) {
    const onBand = rnd() < 0.62;
    const x = rnd() * W;
    const y = clamp(onBand ? bandY(x) + (rnd() - 0.5) * horizon * 0.3 : rnd() * horizon * 0.95, 0, horizon);
    milky.push({
      x, y, r: 110 + rnd() * 210,
      a: 0.05 + rnd() * 0.075,
      hue: neb[(rnd() * neb.length) | 0],
      dph: rnd() * 6.28, damp: 8 + rnd() * 22
    });
  }
  motes = [];
  for (let i = 0; i < 14; i++) {
    motes.push({ x: rnd() * W, y: rnd() * horizon, r: 1 + rnd() * 2, a: 0.1 + rnd() * 0.2, ph: rnd() * 6.28, sp: 5 + rnd() * 10 });
  }
}

// 发光粉色云霞（近地平线下层天空）—— 多个柔团叠出蓬松感，底部受光更亮
function buildClouds() {
  clouds = [];
  const N = 6;
  for (let i = 0; i < N; i++) {
    const cx = (i + 0.5) / N * W + (rnd() - 0.5) * W * 0.14;
    const cy = horizon * (0.64 + rnd() * 0.32);
    const baseR = 64 + rnd() * 70;
    const puffs = [];
    const np = 4 + (rnd() * 4 | 0);
    for (let j = 0; j < np; j++) {
      puffs.push({ ox: (rnd() - 0.5) * baseR * 2.6, oy: (rnd() - 0.5) * baseR * 0.65, r: baseR * (0.55 + rnd() * 0.75), a: 0.12 + rnd() * 0.16 });
    }
    clouds.push({ cx, cy, puffs, drift: rnd() * 6.28, hue: rnd() < 0.5 ? '236,118,190' : '220,108,200', core: '255,184,226' });
  }
}
function drawClouds(now) {
  const t = now * 0.00008;
  for (const c of clouds) {
    const dx = Math.sin(t * 60 + c.drift) * 16;
    for (const p of c.puffs) {
      const x = c.cx + p.ox + dx, y = c.cy + p.oy;
      const rg = ctx.createRadialGradient(x, y + p.r * 0.3, p.r * 0.08, x, y, p.r);
      rg.addColorStop(0, `rgba(${c.core},${p.a})`);
      rg.addColorStop(0.5, `rgba(${c.hue},${p.a * 0.6})`);
      rg.addColorStop(1, `rgba(${c.hue},0)`);
      ctx.fillStyle = rg;
      ctx.fillRect(x - p.r, y - p.r, p.r * 2, p.r * 2);
    }
  }
}

let meteors = [];
function updateMeteors(dt) {
  if (meteors.length < 2 && rnd() < dt * 0.55) {        // 更频繁
    meteors.push({
      x: rnd() * W * 0.7 + W * 0.15, y: rnd() * horizon * 0.45,
      vx: 360 + rnd() * 320, vy: 150 + rnd() * 150,
      life: 0, max: 0.7 + rnd() * 0.6,
      hue: rnd() < 0.5 ? '255,255,255' : (rnd() < 0.5 ? '188,224,255' : '255,234,200')
    });
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i]; m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.life > m.max || m.y > horizon) meteors.splice(i, 1);
  }
}
function drawMeteors() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const m of meteors) {
    const a = Math.sin(clamp(m.life / m.max, 0, 1) * Math.PI);
    const tx = m.x - m.vx * 0.09, ty = m.y - m.vy * 0.09;
    const grd = ctx.createLinearGradient(tx, ty, m.x, m.y);
    grd.addColorStop(0, `rgba(${m.hue},0)`);
    grd.addColorStop(1, `rgba(${m.hue},${0.9 * a})`);
    ctx.strokeStyle = grd; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(m.x, m.y); ctx.stroke();
    const hg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 7);
    hg.addColorStop(0, `rgba(${m.hue},${a})`); hg.addColorStop(1, `rgba(${m.hue},0)`);
    ctx.fillStyle = hg; ctx.fillRect(m.x - 7, m.y - 7, 14, 14);
  }
  ctx.restore();
}

const moon = { x: 0, y: 0, r: 0 };
function drawSkyAndStars(now) {
  // 深邃夜空（暗底，使繁星突出，不发灰）
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#03040d');
  g.addColorStop(0.5, '#06091a');
  g.addColorStop(1, '#0b1028');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizon + 2);

  const dt2 = now * 0.001;
  // 绚彩星云（加色叠加：在暗空上发光而非发灰）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const m of milky) {
    const mx = m.x + Math.sin(dt2 * 0.05 + m.dph) * m.damp;
    const my = m.y + Math.cos(dt2 * 0.045 + m.dph) * m.damp * 0.5;
    const pulse = m.a * (0.7 + 0.3 * Math.sin(dt2 * 0.2 + m.dph));
    const rg = ctx.createRadialGradient(mx, my, 0, mx, my, m.r);
    rg.addColorStop(0, `rgba(${m.hue},${pulse})`);
    rg.addColorStop(0.55, `rgba(${m.hue},${pulse * 0.32})`);
    rg.addColorStop(1, `rgba(${m.hue},0)`);
    ctx.fillStyle = rg;
    ctx.fillRect(mx - m.r, my - m.r, m.r * 2, m.r * 2);
  }
  ctx.restore();

  // 满月（圆月）
  moon.x = W * 0.74; moon.y = horizon * 0.30; moon.r = Math.max(24, Math.min(W, H) * 0.048);
  const halo = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.r * 6);
  halo.addColorStop(0, 'rgba(220,230,255,0.30)');
  halo.addColorStop(0.4, 'rgba(170,180,235,0.10)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(moon.x - moon.r * 6, moon.y - moon.r * 6, moon.r * 12, moon.r * 12);
  const mg = ctx.createRadialGradient(moon.x - moon.r * 0.3, moon.y - moon.r * 0.3, 0, moon.x, moon.y, moon.r);
  mg.addColorStop(0, '#ffffff');
  mg.addColorStop(0.7, '#eef2ff');
  mg.addColorStop(1, '#cdd6ee');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2); ctx.fill();

  // 漂浮光尘
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of motes) {
    const my = ((p.y - dt2 * p.sp) % horizon + horizon) % horizon;
    const mx = p.x + Math.sin(dt2 * 0.4 + p.ph) * 16;
    const fl = p.a * (0.5 + 0.5 * Math.sin(dt2 * 0.8 + p.ph));
    const rg = ctx.createRadialGradient(mx, my, 0, mx, my, p.r * 4);
    rg.addColorStop(0, `rgba(225,235,255,${clamp(fl, 0, 0.4)})`);
    rg.addColorStop(1, 'rgba(225,235,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(mx - p.r * 4, my - p.r * 4, p.r * 8, p.r * 8);
  }
  ctx.restore();

  // 星星（主体）：暗底高对比，亮星带光晕 + 十字星芒
  for (const s of stars) {
    const tw = s.a * (0.55 + 0.45 * Math.sin(now * 0.001 * s.tws + s.tw));
    const al = clamp(tw, 0, 1);
    if (s.tier === 2) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const bg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 6);
      bg.addColorStop(0, `rgba(${s.hue},${al * 0.6})`);
      bg.addColorStop(1, `rgba(${s.hue},0)`);
      ctx.fillStyle = bg;
      ctx.fillRect(s.x - s.r * 6, s.y - s.r * 6, s.r * 12, s.r * 12);
      ctx.globalAlpha = al * 0.6;
      ctx.fillStyle = `rgba(${s.hue},1)`;
      ctx.fillRect(s.x - s.r * 5, s.y - 0.5, s.r * 10, 1);
      ctx.fillRect(s.x - 0.5, s.y - s.r * 5, 1, s.r * 10);
      ctx.restore();
      ctx.globalAlpha = al;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (s.tier === 1) {
      ctx.globalAlpha = al;
      ctx.fillStyle = `rgba(${s.hue},1)`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = al;
      ctx.fillStyle = `rgba(${s.hue},1)`;
      ctx.fillRect(s.x, s.y, s.r, s.r);
      ctx.globalAlpha = 1;
    }
  }

  // 流星
  drawMeteors();
}

// ============================================================
//  SEA
// ============================================================
function drawSea(now) {
  const g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0, '#0a1828');
  g.addColorStop(0.18, '#071019');
  g.addColorStop(1, '#02040a');
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon, W, H - horizon);

  // moon glitter path
  const t = now * 0.001;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 46; i++) {
    const fy = i / 46;
    const y = horizon + fy * (H - horizon) * 0.62;
    const spread = 6 + fy * fy * (moon.r * 3.4);
    const cx = moon.x + Math.sin(t * 1.6 + i * 1.7) * spread * 0.5;
    const w = (moon.r * 0.5) * (1 - fy * 0.4) + Math.sin(t * 3 + i) * 6;
    const a = (0.16 * (1 - fy)) * (0.6 + 0.4 * Math.sin(t * 4 + i * 2.3));
    ctx.fillStyle = `rgba(190,212,250,${clamp(a, 0, 0.2)})`;
    ctx.fillRect(cx - w / 2, y, w, 1.4);
  }
  // general wave shimmer
  for (let i = 0; i < 30; i++) {
    const fy = i / 30;
    const y = horizon + 4 + fy * (H - horizon) * 0.9;
    const x = ((i * 137.5 + t * 18 * (0.4 + fy)) % (W + 120)) - 60;
    const w = 30 + fy * 90;
    const a = 0.04 + fy * 0.05;
    ctx.fillStyle = `rgba(120,160,210,${a})`;
    ctx.fillRect(x, y, w, 1);
  }
  ctx.restore();

  // horizon glow line
  ctx.fillStyle = 'rgba(120,150,200,0.25)';
  ctx.fillRect(0, horizon - 1, W, 1.5);
}

// ============================================================
//  RAIN  (cruise)
// ============================================================
let drops = [];
function buildDrops() {
  drops = [];
  for (let i = 0; i < 620; i++) {
    const d = 0.4 + rnd();           // depth 0.4..1.4
    drops.push({
      x: rnd() * W * 1.2 - W * 0.1,
      y: rnd() * H,
      depth: d,
      spd: 460 + d * 760,
      len: 9 + d * 20,
      a: 0.14 + d * 0.30

  }
}
function updateRain(dt) {
  if (mode === 'combat') {
    rain.amount = approach(rain.amount, 0, dt * 2.2);
  } else if (rain.state === 'awaitSheath') {
    const sp = sword.active ? clamp(sword.t / SHEATH_DUR, 0, 1) : 1;
    if (sp < 0.60) {                          // (b) 收鞘下行：把雨顺势带下来
      const k = sp / 0.60;
      rain.amount = 0.55 * k;
      rain.speedMul = 0.45 + 0.65 * k;
    } else {                                   // (c) 顿：雨缓慢停住（悬停感）
      rain.amount = Math.max(rain.amount, 0.5);
      rain.speedMul = approach(rain.speedMul, 0.05, dt * 3.5);
    }
    if (!sword.active || (sword.sheathing && sword.t >= SHEATH_DUR - 0.02)) {
      rain.state = 'burst'; rain.flash = 1;     // (d) 完全入鞘 → 倾落骤雨 + 闪光
    }
  } else if (rain.state === 'burst') {
    rain.amount = approach(rain.amount, 1.0, dt * 5);
    rain.speedMul = approach(rain.speedMul, 1.6, dt * 5);
    if (rain.amount > 0.97) rain.state = 'sustain';
  } else if (rain.state === 'intro') {
    rain.t += dt;
    const k = smooth(2.6, 5.0, rain.t);                      // 慢放细雨 → 骤雨
    rain.amount = lerp(0.15, 1.0, k);
    rain.speedMul = lerp(0.16, 1.55, k);
    if (k >= 1) rain.state = 'sustain';
  } else {                                                    // sustain：保持骤雨
    rain.amount = approach(rain.amount, 1.0, dt * 2);
    rain.speedMul = approach(rain.speedMul, 1.55, dt * 2);
  }
  if (rain.flash > 0) rain.flash = approach(rain.flash, 0, dt * 3);
  if (rain.amount < 0.001) return;
  const sm = rain.speedMul;
  const active = Math.floor(drops.length * rain.amount);
  for (let i = 0; i < active; i++) {
    const d = drops[i];
    d.y += d.spd * sm * dt;
    d.x += rain.wind * sm * dt * (d.depth * 0.5);
    if (d.y > H + d.len) { d.y = -d.len - rnd() * 40; d.x = rnd() * W * 1.25 - W * 0.12; }
  }
}
function drawRain() {
  if (rain.amount < 0.001) return;
  const sm = rain.speedMul;
  const active = Math.floor(drops.length * rain.amount);
  ctx.lineCap = 'round';
  for (let i = 0; i < active; i++) {
    const d = drops[i];
    const streak = d.len * (0.35 + sm * 0.9);
    const dx = rain.wind * 0.0016 * streak * d.depth;
    ctx.strokeStyle = `rgba(180,205,240,${d.a * clamp(rain.amount * 1.1, 0, 1)})`;
    ctx.lineWidth = 0.6 + d.depth * 0.7;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + dx, d.y + streak);
    ctx.stroke();
  }
}

// ============================================================
//  WAKE — 船前进：海面尾迹自地平线扑面流过 + 船首破浪泡沫
// ============================================================
let wake = [];
function buildWake() {
  wake = [];
  for (let i = 0; i < 80; i++) wake.push({ off: rnd() * 2 - 1, fy: rnd(), spd: 0.55 + rnd() * 0.7, w: 0.5 + rnd() * 0.9 });
}
function drawWake(dt) {
  const nb = horizon + (H - horizon) * 0.56;   // 近处水面下界（船沿之上）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of wake) {
    p.fy += (0.10 + p.fy * p.fy * 1.5) * p.spd * dt;   // 越近越快（透视加速）
    if (p.fy > 1.06) { p.fy = 0; p.off = rnd() * 2 - 1; p.spd = 0.55 + rnd() * 0.7; }
    const y = horizon + 4 + p.fy * (nb - horizon);
    const x = W * 0.5 + p.off * W * (0.03 + p.fy * p.fy * 0.6);    // 自地平线中心向外扩散
    const len = 4 + p.fy * p.fy * 30;
    const a = smooth(0, 0.18, p.fy) * (1 - smooth(0.82, 1.06, p.fy)) * 0.34 * p.w;
    const dirx = x - W * 0.5, diry = (y - horizon) + 0.0001;
    const dl = Math.hypot(dirx, diry) || 1;
    const ux = dirx / dl, uy = diry / dl;
    ctx.strokeStyle = `rgba(190,216,248,${clamp(a, 0, 0.5)})`;
    ctx.lineWidth = 0.8 + p.fy * 1.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - ux * len * 0.5, y - uy * len * 0.5);
    ctx.lineTo(x + ux * len * 0.5, y + uy * len * 0.5);
    ctx.stroke();
  }
  // 船首破浪：底部中央一抹流动泡沫光
  const foam = ctx.createRadialGradient(W * 0.5, nb, 0, W * 0.5, nb, W * 0.34);
  foam.addColorStop(0, 'rgba(200,222,250,0.12)');
  foam.addColorStop(1, 'rgba(200,222,250,0)');
  ctx.fillStyle = foam;
  ctx.fillRect(0, horizon, W, nb - horizon + 30);
  ctx.restore();
}

// ============================================================
//  BOAT (first person)
// ============================================================
let bobT = 0;
function boatBob() {
  return Math.sin(bobT * 0.7) * 6 + Math.sin(bobT * 1.7 + 1) * 2.5;
}
function drawBoat(now) {
  const bob = boatBob();
  const tilt = Math.sin(bobT * 0.55) * 0.01;

  // （灯笼已移除，改为纯月光）

  // boat foreground silhouette (we sit here, looking over the bow)
  ctx.save();
  ctx.translate(W / 2, H);
  ctx.rotate(tilt);
  ctx.translate(-W / 2, -H + bob);
  const topY = H - Math.min(150, H * 0.20);
  const dip = H - Math.min(96, H * 0.13);
  // rim light
  ctx.strokeStyle = 'rgba(150,180,225,0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-4, topY);
  ctx.quadraticCurveTo(W * 0.5, dip - 14, W + 4, topY);
  ctx.stroke();
  // body
  ctx.beginPath();
  ctx.moveTo(-4, topY);
  ctx.quadraticCurveTo(W * 0.5, dip, W + 4, topY);
  ctx.lineTo(W + 4, H + 4);
  ctx.lineTo(-4, H + 4);
  ctx.closePath();
  const bg = ctx.createLinearGradient(0, dip, 0, H);
  bg.addColorStop(0, '#0a0a0f');
  bg.addColorStop(1, '#020205');
  ctx.fillStyle = bg;
  ctx.fill();
  // a couple plank lines
  ctx.strokeStyle = 'rgba(120,150,200,0.05)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(0, dip + i * 18);
    ctx.quadraticCurveTo(W * 0.5, dip + i * 12, W, dip + i * 18);
    ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
//  SWORD (combat) — first person, blade forward
// ============================================================
function setSword(active) {
  if (active) { sword.active = true; sword.sheathing = false; sword.t = 0; sword.glint = 0; }
  else { sword.sheathing = true; sword.t = 0; }
}
// 拔剑路径：出鞘(左) → 举过头顶(高) → 挥下至正前方（CR 连续曲线，apex 在 u=0.667）
const GRIP_PATH = [{ x: 0.00, y: 0.74 }, { x: 0.22, y: 0.70 }, { x: 0.49, y: 0.46 }, { x: 0.64, y: 1.00 }];
const TIP_PATH  = [{ x: 0.12, y: 0.98 }, { x: 0.03, y: 0.30 }, { x: 0.54, y: -0.12 }, { x: 0.50, y: 0.44 }];
// 收刀路径：正前方 → 左下方 → 抬手左上·剑指右下对准鞘口 → 入鞘
const SHEATH_G_PATH = [{ x: 0.64, y: 1.00 }, { x: 0.40, y: 0.86 }, { x: -0.17, y: 0.22 }, { x: 0.06, y: 0.80 }];
const SHEATH_T_PATH = [{ x: 0.50, y: 0.44 }, { x: 0.12, y: 1.04 }, { x: 0.05, y: 0.80 }, { x: 0.18, y: 1.10 }];
const SHEATH_G  = { x: 0.06, y: 0.80 };   // 纯鞘中：握柄在鞘口
const SHEATH_T  = { x: 0.18, y: 1.10 };
const DRAW_END = 1.42, SHEATH_DUR = 1.18;

// 拔剑速度：抬到头顶 → 顿一下(慢非停) → 用力加速劈下
function drawEase(dp) {
  if (dp < 0.46) { const x = dp / 0.46; const e = 1 - (1 - x) * (1 - x) * (1 - x); return 0.667 * (0.82 * e + 0.18 * x); }
  if (dp < 0.60) { const x = (dp - 0.46) / 0.14; return 0.667 + 0.025 * x; }                 // 顿
  const x = (dp - 0.60) / 0.40; return 0.692 + 0.308 * (0.75 * x * x * x + 0.25 * x);         // 发力
}
// 收刀速度：前段快 → 将收未收时顿一下 → 用力收回
function sheathEase(sp) {
  if (sp < 0.60) { const x = sp / 0.60; const e = 1 - (1 - x) * (1 - x) * (1 - x); return 0.85 * (0.82 * e + 0.18 * x); }   // 前段快，收到将满
  if (sp < 0.87) { const x = (sp - 0.60) / 0.27; return 0.85 + 0.05 * x; }                                                 // 顿（更久）
  const x = (sp - 0.87) / 0.13; return 0.90 + 0.10 * (0.8 * x * x * x + 0.2 * x);                                          // 用力收回
}

function swordPoseAt(st) {
  const L = 0.62 * H;       // 刀身固定长度（刚体）
  let g, t, a = 1;
  if (sword.sheathing) {                        // 收刀：沿收刀曲线 + 速度顿挫
    const sp = clamp(st / SHEATH_DUR, 0, 1);
    const u = sheathEase(sp);
    g = crPath(SHEATH_G_PATH, u); t = crPath(SHEATH_T_PATH, u);
    a = 1 - smooth(0.93, 1.0, sp);
  } else if (st < 0.30) {                        // ① 弹鞘：剑柄弹出一点（仍大半在鞘）
    const k = smooth(0, 0.30, st);
    g = { x: lerp(SHEATH_G.x, GRIP_PATH[0].x, k), y: lerp(SHEATH_G.y, GRIP_PATH[0].y, k) };
    t = { x: lerp(SHEATH_T.x, TIP_PATH[0].x, k), y: lerp(SHEATH_T.y, TIP_PATH[0].y, k) };
  } else if (st < DRAW_END) {                    // ② 拔剑：顶部顿挫 + 加速劈下
    const dp = (st - 0.30) / (DRAW_END - 0.30);
    const u = drawEase(dp);
    g = crPath(GRIP_PATH, u); t = crPath(TIP_PATH, u);
  } else {                                        // 持剑向前 + 轻微呼吸
    const sway = Math.sin((st - DRAW_END) * 1.5 + bobT * 0.7) * 0.006;
    g = { x: GRIP_PATH[3].x + Math.sin(bobT * 0.7) * 0.004, y: GRIP_PATH[3].y };
    t = { x: TIP_PATH[3].x + sway, y: TIP_PATH[3].y + sway * 0.5 };
  }
  let gx = g.x * W, gy = g.y * H, tx = t.x * W, ty = t.y * H;
  const dx = tx - gx, dy = ty - gy, dl = Math.hypot(dx, dy) || 1;   // 定长刚体
  tx = gx + dx / dl * L; ty = gy + dy / dl * L;
  return { gx, gy, tx, ty, a };
}
function swordPose() { return swordPoseAt(sword.t); }

// 刀鞘（saya）：在左下，刀从鞘口滑出/归鞘
function drawScabbard(alpha) {
  if (alpha <= 0.002) return;
  const mx = 0.05 * W, my = 0.80 * H;     // 鞘口（朝左上，刀从此处出入）
  const dx = 0.30 * W, dy = 1.40 * H;     // 鞘尾（贴向身体，伸出画面下方）
  const ang = Math.atan2(dy - my, dx - mx);
  const nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
  const hw = 9.5;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(mx + nx * hw, my + ny * hw);
  ctx.lineTo(dx + nx * hw * 0.7, dy + ny * hw * 0.7);
  ctx.lineTo(dx - nx * hw * 0.7, dy - ny * hw * 0.7);
  ctx.lineTo(mx - nx * hw, my - ny * hw);
  ctx.closePath();
  const g = ctx.createLinearGradient(mx + nx * hw, my + ny * hw, mx - nx * hw, my - ny * hw);
  g.addColorStop(0, '#05060a'); g.addColorStop(0.45, '#1c2330'); g.addColorStop(0.55, '#232b39'); g.addColorStop(1, '#05060a');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,225,0.22)'; ctx.lineWidth = 1.2;  // 月光描边
  ctx.beginPath(); ctx.moveTo(mx - nx * hw, my - ny * hw); ctx.lineTo(dx - nx * hw * 0.7, dy - ny * hw * 0.7); ctx.stroke();
  ctx.strokeStyle = 'rgba(205,175,115,0.55)'; ctx.lineWidth = 3;    // 鞘口金具
  ctx.beginPath(); ctx.moveTo(mx + nx * hw, my + ny * hw); ctx.lineTo(mx - nx * hw, my - ny * hw); ctx.stroke();
  ctx.restore();
}
function mix(A, B, k) {
  return { gx: lerp(A.gx, B.gx, k), gy: lerp(A.gy, B.gy, k), tx: lerp(A.tx, B.tx, k), ty: lerp(A.ty, B.ty, k) };
}
function drawSword() {
  if (!sword.active) return;
  const P = swordPose();
  const gx = P.gx, gy = P.gy, tx = P.tx, ty = P.ty;
  const ang = Math.atan2(ty - gy, tx - gx);
  const len = Math.hypot(tx - gx, ty - gy);
  const nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
  const ux = Math.cos(ang), uy = Math.sin(ang);

  // 挥剑/收刀弧光：采样最近若干帧的剑尖，连成渐隐弧形拖影（弧度感 / 动态模糊）
  if ((!sword.sheathing && sword.t > 0.34 && sword.t < 1.5) || sword.sheathing) {
    const pts = [{ x: tx, y: ty }];
    for (let k = 1; k <= 7; k++) { const st = sword.t - k * 0.045; if (st < 0.02) break; const Q = swordPoseAt(st); pts.push({ x: Q.tx, y: Q.ty }); }
    if (pts.length > 2) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 0; i < pts.length - 1; i++) {
        ctx.strokeStyle = `rgba(206,228,255,${0.20 * (1 - i / pts.length)})`;
        ctx.lineWidth = 8 * (1 - i / (pts.length + 1));
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i + 1].x, pts[i + 1].y); ctx.stroke();
      }
      ctx.restore();
    }
  }

  ctx.save();
  ctx.globalAlpha = P.a;

  // --- handle (foreground, near grip) ---
  const hbx = gx + ux * 4, hby = gy + uy * 4;
  ctx.strokeStyle = '#1c140e';
  ctx.lineWidth = 13; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(gx - ux * 38, gy - uy * 38); ctx.lineTo(hbx, hby); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,110,70,0.5)';
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 5; i++) {
    const f = i / 5;
    const px = lerp(gx - ux * 36, hbx, f), py = lerp(gy - uy * 36, hby, f);
    ctx.beginPath(); ctx.moveTo(px - nx * 6, py - ny * 6); ctx.lineTo(px + nx * 6, py + ny * 6); ctx.stroke();

  ctx.fillStyle = '#2a2118';
  ctx.beginPath();
  ctx.ellipse(gx + ux * 6, gy + uy * 6, 4, 15, ang, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(200,170,110,0.5)'; ctx.lineWidth = 1; ctx.stroke();

  // --- blade: tapered, slightly curved (katana) ---
  const baseW = 9, tipW = 1.2;
  const curve = 16; // curvature bow
  const mx = (gx + tx) / 2 + nx * curve, my = (gy + ty) / 2 + ny * curve;
  // outline via quadratic on both edges
  ctx.beginPath();
  ctx.moveTo(gx + nx * baseW, gy + ny * baseW);
  ctx.quadraticCurveTo(mx + nx * (baseW * 0.5), my + ny * (baseW * 0.5), tx + nx * tipW, ty + ny * tipW);
  ctx.lineTo(tx - nx * tipW, ty - ny * tipW);
  ctx.quadraticCurveTo(mx - nx * (baseW * 0.5), my - ny * (baseW * 0.5), gx - nx * baseW, gy - ny * baseW);
  ctx.closePath();
  const blade = ctx.createLinearGradient(gx, gy, tx, ty);
  blade.addColorStop(0, '#3a4654');
  blade.addColorStop(0.5, '#566576');
  blade.addColorStop(1, '#8a9bb0');
  ctx.fillStyle = blade;
  ctx.fill();
  // moonlit edge highlight
  ctx.strokeStyle = 'rgba(225,238,255,0.85)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(gx + nx * baseW, gy + ny * baseW);
  ctx.quadraticCurveTo(mx + nx * (baseW * 0.5), my + ny * (baseW * 0.5), tx + nx * tipW, ty + ny * tipW);
  ctx.stroke();
  // spine shadow line
  ctx.strokeStyle = 'rgba(10,16,24,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(gx - nx * baseW * 0.6, gy - ny * baseW * 0.6);
  ctx.quadraticCurveTo(mx - nx * baseW * 0.3, my - ny * baseW * 0.3, tx - nx * tipW, ty - ny * tipW);
  ctx.stroke();

  // --- travelling glint after the swing ---
  if (!sword.sheathing && sword.t > 1.42) {
    sword.glint += 0.016;
    const gp = (sword.glint % 2.2) / 1.0;
    if (gp <= 1) {
      const gx2 = lerp(gx, tx, gp), gy2 = lerp(gy, ty, gp);
      const a = Math.sin(gp * Math.PI);
      ctx.fillStyle = `rgba(255,255,255,${0.9 * a})`;
      ctx.beginPath(); ctx.ellipse(gx2 + nx * baseW * (1 - gp), gy2 + ny * baseW * (1 - gp), 3, 6, ang, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  // 鞘：画在刀之后 → 遮住仍在鞘内的部分，形成出鞘/归鞘
  drawScabbard(sword.sheathing ? P.a : 1);

  // ① 弹鞘：鞘口冒光反光（剑柄弹出的瞬间）
  if (!sword.sheathing && sword.t < 0.32) {
    const fl = Math.sin(smooth(0, 0.32, sword.t) * Math.PI);   // 0→1→0
    const mx = 0.05 * W, my = 0.80 * H;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createRadialGradient(mx, my, 0, mx, my, 44);
    fg.addColorStop(0, `rgba(228,242,255,${0.55 * fl})`);
    fg.addColorStop(0.5, `rgba(150,190,240,${0.18 * fl})`);
    fg.addColorStop(1, 'rgba(150,190,240,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(mx - 44, my - 44, 88, 88);
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * fl})`; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx - 16, my); ctx.lineTo(mx + 16, my);
    ctx.moveTo(mx, my - 16); ctx.lineTo(mx, my + 16);
    ctx.stroke();
    ctx.restore();
  }

  // 收刀：将收未收时冒一下光（鞘口）
  if (sword.sheathing) {
    const sp = sword.t / SHEATH_DUR;
    if (sp > 0.62 && sp < 0.90) {
      const fl = Math.sin(smooth(0.62, 0.76, sp) * Math.PI * 0.5) * (1 - smooth(0.84, 0.90, sp));
      const mx = 0.05 * W, my = 0.80 * H;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const fg = ctx.createRadialGradient(mx, my, 0, mx, my, 42);
      fg.addColorStop(0, `rgba(228,242,255,${0.55 * fl})`);
      fg.addColorStop(0.5, `rgba(150,190,240,${0.18 * fl})`);
      fg.addColorStop(1, 'rgba(150,190,240,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(mx - 42, my - 42, 84, 84);
      ctx.strokeStyle = `rgba(255,255,255,${0.75 * fl})`; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(mx - 16, my); ctx.lineTo(mx + 16, my);
      ctx.moveTo(mx, my - 16); ctx.lineTo(mx, my + 16);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ============================================================
//  TINT / VIGNETTE
// ============================================================
function drawAtmosphere() {
  // mode color wash
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const warm = tint, cool = 1 - tint;
  if (cool > 0.01) {
    ctx.fillStyle = `rgba(90,70,150,${0.025 * cool})`;     // 巡航：淡紫微染，不发灰
    ctx.fillRect(0, 0, W, H);
  }
  if (warm > 0.01) {
    const wg = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.7);
    wg.addColorStop(0, `rgba(150,60,40,${0.05 * warm})`);
    wg.addColorStop(1, `rgba(120,40,30,${0.10 * warm})`);
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, H);
  }
  if (rain.flash > 0.01) {                                  // 骤雨倾落瞬间的闪光
    ctx.fillStyle = `rgba(220,228,255,${rain.flash * 0.12})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  // vignette（减弱 + 暗紫，避免灰蒙蒙）
  const v = ctx.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.42, W * 0.5, H * 0.5, Math.max(W, H) * 0.82);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(8,4,16,0.38)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

// ============================================================
//  MODE / UI
// ============================================================
const elStatus = document.getElementById('status');
const elTitle = document.getElementById('title');
const elHint = document.getElementById('hint');
const btnCruise = document.getElementById('btn-cruise');
const btnCombat = document.getElementById('btn-combat');
const btnGuard = document.getElementById('btn-guard');

function setMode(m) {
  if (m === mode) return;
  const from = mode;
  mode = m;
  if (m === 'cruise') {
    if (from === 'combat') {
      rain.state = 'awaitSheath';   // 收刀入鞘那一瞬 → 骤雨倾落
    } else {
      rain.state = 'intro'; rain.t = 0; rain.amount = 0.15; rain.speedMul = 0.16;
    }
    setSword(false);
  } else {
    combatRemaining = 30 * 60;
    rain.state = 'fadeout';
    setSword(true);
  }
  btnCruise.classList.toggle('active', m === 'cruise');
  btnCombat.classList.toggle('active', m === 'combat');
  elTitle.style.opacity = '0.32';
}
function toggleGuard() {
  guard = !guard;
  btnGuard.classList.toggle('active', guard);
}
// 底部小字：固定轮回两句（与模式无关）
const HINTS = ['在下瞳雨 · 赤瞳之雨', '心向美好 · 瞳雨不止'];
let hintIdx = 0, hintTimer = 0, hintFading = false;
function updateHint() { elHint.textContent = HINTS[hintIdx]; }
function cycleHint(dt) {
  hintTimer += dt;
  if (hintTimer > 5.5 && !hintFading) {
    hintFading = true;
    elHint.style.opacity = '0';
    setTimeout(() => {
      hintIdx = (hintIdx + 1) % HINTS.length;
      elHint.textContent = HINTS[hintIdx];
      elHint.style.opacity = '1';
      hintTimer = 0; hintFading = false;
    }, 700);
  }
}

btnCruise.addEventListener('click', () => setMode('cruise'));
btnCombat.addEventListener('click', () => setMode('combat'));
btnGuard.addEventListener('click', toggleGuard);

let titleHidden = false;
function updateStatus(dt) {
  // combat countdown
  if (mode === 'combat' && !guard) {
    combatRemaining -= dt;
    if (combatRemaining <= 0) {
      combatRemaining = 0;
      ending = 2.5;
      setMode('cruise');
    }
  }
  let txt = '', cls = '';
  if (mode === 'combat') {
    if (guard) { txt = '守护中 · ∞'; cls = 'guard'; }
    else {
      const s = Math.max(0, Math.ceil(combatRemaining));
      txt = `战 · ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }
  } else if (ending > 0) {
    txt = '时已尽 · 雨复落'; cls = 'ending';
  }
  elStatus.textContent = txt;
  elStatus.className = cls;
  if (ending > 0) ending -= dt;

  // fade title out after intro
  if (!titleHidden && tNow > 5) { titleHidden = true; elTitle.style.opacity = '0.28'; }
}

// ============================================================
//  LOOP
// ============================================================
let last = 0, tNow = 0;
function frame(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;     // clamp big gaps
  tNow += dt;
  bobT += dt;

  // crossfade tint toward target
  tint = approach(tint, mode === 'combat' ? 1 : 0, dt * 1.4);

  // sword timeline
  if (sword.active) {
    sword.t += dt;
    if (sword.sheathing && sword.t > SHEATH_DUR + 0.04) sword.active = false;
  }

  updateMeteors(dt);
  updateRain(dt);
  updateStatus(dt);
  cycleHint(dt);

  // ---- draw ----
  ctx.clearRect(0, 0, W, H);
  drawSkyAndStars(now);
  drawSea(now);
  drawWake(dt);
  drawRain();
  drawBoat(now);
  drawSword();
  drawAtmosphere();

  requestAnimationFrame(frame);
}

// pause when hidden (battery)
let rafRunning = true;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { last = 0; }
});

// ---------- init ----------
resize();
buildDrops();
buildWake();
updateHint();
requestAnimationFrame(frame);
</script>
</body>
